
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">AdSlot List</h5>

    <a
            [routerLink]="['/createAdSlot']"
            class="btn btn-primary btn-sm">
        Create AdSlot
    </a>
</div>

<div class="table-responsive">
    <table class="table table-hover table-striped table-bordered table-sm">
        <thead>
        <tr class="table-dark text-center">
                                    <th scope="col">slotCode</th>
                        <th scope="col">width</th>
                        <th scope="col">height</th>
                        <th scope="col">floorPrice</th>
                        <th scope="col">Format</th>
                        <th scope="col" colspan="2">Actions</th>
        </tr>
        </thead>

        <tbody>
        @for (adSlot of adSlots; track adSlot.adSlotId) {
            <tr
                    class="text-center">

                                <td class="align-middle">
                    {{ adSlot.slotCode }}
                </td>
                                <td class="align-middle">
                    {{ adSlot.width }}
                </td>
                                <td class="align-middle">
                    {{ adSlot.height }}
                </td>
                                <td class="align-middle">
                    {{ adSlot.floorPrice }}
                </td>
                                <td class="align-middle">
                    {{ adSlot.Format }}
                </td>
                
                <td class="align-middle">
                    <a
                            [routerLink]="['/loadAdSlot', adSlot.adSlotId]"
                            class="btn btn-primary btn-sm">
                        Edit
                    </a>
                </td>

                <td class="align-middle">
                    <button
                            type="button"
                            (click)="deleteAdSlot(adSlot.adSlotId)"
                            class="btn btn-danger btn-sm">
                        Delete
                    </button>
                </td>

            </tr>
        }

        
        @if (adSlots?.length === 0) {
            <tr>
                <td
                        colspan="7"
                        class="text-center">
                    No adSlots found.
                </td>
            </tr>
        }

        </tbody>
    </table>
</div>
