
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">DataProvider List</h5>

    <a
            [routerLink]="['/createDataProvider']"
            class="btn btn-primary btn-sm">
        Create DataProvider
    </a>
</div>

<div class="table-responsive">
    <table class="table table-hover table-striped table-bordered table-sm">
        <thead>
        <tr class="table-dark text-center">
                                    <th scope="col">name</th>
                        <th scope="col">website</th>
                        <th scope="col">ProviderType</th>
                        <th scope="col" colspan="2">Actions</th>
        </tr>
        </thead>

        <tbody>
        @for (dataProvider of dataProviders; track dataProvider.dataProviderId) {
            <tr
                    class="text-center">

                                <td class="align-middle">
                    {{ dataProvider.name }}
                </td>
                                <td class="align-middle">
                    {{ dataProvider.website }}
                </td>
                                <td class="align-middle">
                    {{ dataProvider.ProviderType }}
                </td>
                
                <td class="align-middle">
                    <a
                            [routerLink]="['/loadDataProvider', dataProvider.dataProviderId]"
                            class="btn btn-primary btn-sm">
                        Edit
                    </a>
                </td>

                <td class="align-middle">
                    <button
                            type="button"
                            (click)="deleteDataProvider(dataProvider.dataProviderId)"
                            class="btn btn-danger btn-sm">
                        Delete
                    </button>
                </td>

            </tr>
        }

        
        @if (dataProviders?.length === 0) {
            <tr>
                <td
                        colspan="5"
                        class="text-center">
                    No dataProviders found.
                </td>
            </tr>
        }

        </tbody>
    </table>
</div>
