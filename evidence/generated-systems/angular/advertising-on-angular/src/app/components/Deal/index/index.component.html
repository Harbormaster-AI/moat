
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">Deal List</h5>

    <a
            [routerLink]="['/createDeal']"
            class="btn btn-primary btn-sm">
        Create Deal
    </a>
</div>

<div class="table-responsive">
    <table class="table table-hover table-striped table-bordered table-sm">
        <thead>
        <tr class="table-dark text-center">
                                    <th scope="col">floorPrice</th>
                        <th scope="col">DealType</th>
                        <th scope="col" colspan="2">Actions</th>
        </tr>
        </thead>

        <tbody>
        @for (deal of deals; track deal.dealId) {
            <tr
                    class="text-center">

                                <td class="align-middle">
                    {{ deal.floorPrice }}
                </td>
                                <td class="align-middle">
                    {{ deal.DealType }}
                </td>
                
                <td class="align-middle">
                    <a
                            [routerLink]="['/loadDeal', deal.dealId]"
                            class="btn btn-primary btn-sm">
                        Edit
                    </a>
                </td>

                <td class="align-middle">
                    <button
                            type="button"
                            (click)="deleteDeal(deal.dealId)"
                            class="btn btn-danger btn-sm">
                        Delete
                    </button>
                </td>

            </tr>
        }

        
        @if (deals?.length === 0) {
            <tr>
                <td
                        colspan="4"
                        class="text-center">
                    No deals found.
                </td>
            </tr>
        }

        </tbody>
    </table>
</div>
