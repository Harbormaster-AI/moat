
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">GeoRegion List</h5>

    <a
            [routerLink]="['/createGeoRegion']"
            class="btn btn-primary btn-sm">
        Create GeoRegion
    </a>
</div>

<div class="table-responsive">
    <table class="table table-hover table-striped table-bordered table-sm">
        <thead>
        <tr class="table-dark text-center">
                                    <th scope="col">code</th>
                        <th scope="col">name</th>
                        <th scope="col">RegionType</th>
                        <th scope="col" colspan="2">Actions</th>
        </tr>
        </thead>

        <tbody>
        @for (geoRegion of geoRegions; track geoRegion.geoRegionId) {
            <tr
                    class="text-center">

                                <td class="align-middle">
                    {{ geoRegion.code }}
                </td>
                                <td class="align-middle">
                    {{ geoRegion.name }}
                </td>
                                <td class="align-middle">
                    {{ geoRegion.RegionType }}
                </td>
                
                <td class="align-middle">
                    <a
                            [routerLink]="['/loadGeoRegion', geoRegion.geoRegionId]"
                            class="btn btn-primary btn-sm">
                        Edit
                    </a>
                </td>

                <td class="align-middle">
                    <button
                            type="button"
                            (click)="deleteGeoRegion(geoRegion.geoRegionId)"
                            class="btn btn-danger btn-sm">
                        Delete
                    </button>
                </td>

            </tr>
        }

        
        @if (geoRegions?.length === 0) {
            <tr>
                <td
                        colspan="5"
                        class="text-center">
                    No geoRegions found.
                </td>
            </tr>
        }

        </tbody>
    </table>
</div>
