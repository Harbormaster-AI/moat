
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">Placement List</h5>

    <a
            [routerLink]="['/createPlacement']"
            class="btn btn-primary btn-sm">
        Create Placement
    </a>
</div>

<div class="table-responsive">
    <table class="table table-hover table-striped table-bordered table-sm">
        <thead>
        <tr class="table-dark text-center">
                                    <th scope="col">name</th>
                        <th scope="col">flight</th>
                        <th scope="col">goalImpressions</th>
                        <th scope="col" colspan="2">Actions</th>
        </tr>
        </thead>

        <tbody>
        @for (placement of placements; track placement.placementId) {
            <tr
                    class="text-center">

                                <td class="align-middle">
                    {{ placement.name }}
                </td>
                                <td class="align-middle">
                    {{ placement.flight }}
                </td>
                                <td class="align-middle">
                    {{ placement.goalImpressions }}
                </td>
                
                <td class="align-middle">
                    <a
                            [routerLink]="['/loadPlacement', placement.placementId]"
                            class="btn btn-primary btn-sm">
                        Edit
                    </a>
                </td>

                <td class="align-middle">
                    <button
                            type="button"
                            (click)="deletePlacement(placement.placementId)"
                            class="btn btn-danger btn-sm">
                        Delete
                    </button>
                </td>

            </tr>
        }

        
        @if (placements?.length === 0) {
            <tr>
                <td
                        colspan="5"
                        class="text-center">
                    No placements found.
                </td>
            </tr>
        }

        </tbody>
    </table>
</div>
