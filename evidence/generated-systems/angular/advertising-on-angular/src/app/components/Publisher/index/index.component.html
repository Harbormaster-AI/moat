
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">Publisher List</h5>

    <a
            [routerLink]="['/createPublisher']"
            class="btn btn-primary btn-sm">
        Create Publisher
    </a>
</div>

<div class="table-responsive">
    <table class="table table-hover table-striped table-bordered table-sm">
        <thead>
        <tr class="table-dark text-center">
                                    <th scope="col">name</th>
                        <th scope="col">website</th>
                        <th scope="col">PublisherType</th>
                        <th scope="col" colspan="2">Actions</th>
        </tr>
        </thead>

        <tbody>
        @for (publisher of publishers; track publisher.publisherId) {
            <tr
                    class="text-center">

                                <td class="align-middle">
                    {{ publisher.name }}
                </td>
                                <td class="align-middle">
                    {{ publisher.website }}
                </td>
                                <td class="align-middle">
                    {{ publisher.PublisherType }}
                </td>
                
                <td class="align-middle">
                    <a
                            [routerLink]="['/loadPublisher', publisher.publisherId]"
                            class="btn btn-primary btn-sm">
                        Edit
                    </a>
                </td>

                <td class="align-middle">
                    <button
                            type="button"
                            (click)="deletePublisher(publisher.publisherId)"
                            class="btn btn-danger btn-sm">
                        Delete
                    </button>
                </td>

            </tr>
        }

        
        @if (publishers?.length === 0) {
            <tr>
                <td
                        colspan="5"
                        class="text-center">
                    No publishers found.
                </td>
            </tr>
        }

        </tbody>
    </table>
</div>
