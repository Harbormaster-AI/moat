
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">TargetingProfile List</h5>

    <a
            [routerLink]="['/createTargetingProfile']"
            class="btn btn-primary btn-sm">
        Create TargetingProfile
    </a>
</div>

<div class="table-responsive">
    <table class="table table-hover table-striped table-bordered table-sm">
        <thead>
        <tr class="table-dark text-center">
                                    <th scope="col">name</th>
                        <th scope="col" colspan="2">Actions</th>
        </tr>
        </thead>

        <tbody>
        @for (targetingProfile of targetingProfiles; track targetingProfile.targetingProfileId) {
            <tr
                    class="text-center">

                                <td class="align-middle">
                    {{ targetingProfile.name }}
                </td>
                
                <td class="align-middle">
                    <a
                            [routerLink]="['/loadTargetingProfile', targetingProfile.targetingProfileId]"
                            class="btn btn-primary btn-sm">
                        Edit
                    </a>
                </td>

                <td class="align-middle">
                    <button
                            type="button"
                            (click)="deleteTargetingProfile(targetingProfile.targetingProfileId)"
                            class="btn btn-danger btn-sm">
                        Delete
                    </button>
                </td>

            </tr>
        }

        
        @if (targetingProfiles?.length === 0) {
            <tr>
                <td
                        colspan="3"
                        class="text-center">
                    No targetingProfiles found.
                </td>
            </tr>
        }

        </tbody>
    </table>
</div>
