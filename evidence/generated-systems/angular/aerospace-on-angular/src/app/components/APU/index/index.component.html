
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">APU List</h5>

    <a
            [routerLink]="['/createAPU']"
            class="btn btn-primary btn-sm">
        Create APU
    </a>
</div>

<div class="table-responsive">
    <table class="table table-hover table-striped table-bordered table-sm">
        <thead>
        <tr class="table-dark text-center">
                                    <th scope="col">model_</th>
                        <th scope="col" colspan="2">Actions</th>
        </tr>
        </thead>

        <tbody>
        @for (aPU of aPUs; track aPU.aPUId) {
            <tr
                    class="text-center">

                                <td class="align-middle">
                    {{ aPU.model_ }}
                </td>
                
                <td class="align-middle">
                    <a
                            [routerLink]="['/loadAPU', aPU.aPUId]"
                            class="btn btn-primary btn-sm">
                        Edit
                    </a>
                </td>

                <td class="align-middle">
                    <button
                            type="button"
                            (click)="deleteAPU(aPU.aPUId)"
                            class="btn btn-danger btn-sm">
                        Delete
                    </button>
                </td>

            </tr>
        }

        
        @if (aPUs?.length === 0) {
            <tr>
                <td
                        colspan="3"
                        class="text-center">
                    No aPUs found.
                </td>
            </tr>
        }

        </tbody>
    </table>
</div>
