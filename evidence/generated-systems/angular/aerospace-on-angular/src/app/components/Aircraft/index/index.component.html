
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">Aircraft List</h5>

    <a
            [routerLink]="['/createAircraft']"
            class="btn btn-primary btn-sm">
        Create Aircraft
    </a>
</div>

<div class="table-responsive">
    <table class="table table-hover table-striped table-bordered table-sm">
        <thead>
        <tr class="table-dark text-center">
                                    <th scope="col">msn</th>
                        <th scope="col">deliveryDate</th>
                        <th scope="col" colspan="2">Actions</th>
        </tr>
        </thead>

        <tbody>
        @for (aircraft of aircrafts; track aircraft.aircraftId) {
            <tr
                    class="text-center">

                                <td class="align-middle">
                    {{ aircraft.msn }}
                </td>
                                <td class="align-middle">
                    {{ aircraft.deliveryDate }}
                </td>
                
                <td class="align-middle">
                    <a
                            [routerLink]="['/loadAircraft', aircraft.aircraftId]"
                            class="btn btn-primary btn-sm">
                        Edit
                    </a>
                </td>

                <td class="align-middle">
                    <button
                            type="button"
                            (click)="deleteAircraft(aircraft.aircraftId)"
                            class="btn btn-danger btn-sm">
                        Delete
                    </button>
                </td>

            </tr>
        }

        
        @if (aircrafts?.length === 0) {
            <tr>
                <td
                        colspan="4"
                        class="text-center">
                    No aircrafts found.
                </td>
            </tr>
        }

        </tbody>
    </table>
</div>
