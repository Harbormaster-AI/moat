
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">AircraftFamily List</h5>

    <a
            [routerLink]="['/createAircraftFamily']"
            class="btn btn-primary btn-sm">
        Create AircraftFamily
    </a>
</div>

<div class="table-responsive">
    <table class="table table-hover table-striped table-bordered table-sm">
        <thead>
        <tr class="table-dark text-center">
                                    <th scope="col">name</th>
                        <th scope="col">familyCode</th>
                        <th scope="col" colspan="2">Actions</th>
        </tr>
        </thead>

        <tbody>
        @for (aircraftFamily of aircraftFamilys; track aircraftFamily.aircraftFamilyId) {
            <tr
                    class="text-center">

                                <td class="align-middle">
                    {{ aircraftFamily.name }}
                </td>
                                <td class="align-middle">
                    {{ aircraftFamily.familyCode }}
                </td>
                
                <td class="align-middle">
                    <a
                            [routerLink]="['/loadAircraftFamily', aircraftFamily.aircraftFamilyId]"
                            class="btn btn-primary btn-sm">
                        Edit
                    </a>
                </td>

                <td class="align-middle">
                    <button
                            type="button"
                            (click)="deleteAircraftFamily(aircraftFamily.aircraftFamilyId)"
                            class="btn btn-danger btn-sm">
                        Delete
                    </button>
                </td>

            </tr>
        }

        
        @if (aircraftFamilys?.length === 0) {
            <tr>
                <td
                        colspan="4"
                        class="text-center">
                    No aircraftFamilys found.
                </td>
            </tr>
        }

        </tbody>
    </table>
</div>
