
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">BuildSchedule List</h5>

    <a
            [routerLink]="['/createBuildSchedule']"
            class="btn btn-primary btn-sm">
        Create BuildSchedule
    </a>
</div>

<div class="table-responsive">
    <table class="table table-hover table-striped table-bordered table-sm">
        <thead>
        <tr class="table-dark text-center">
                                    <th scope="col">scheduleNumber</th>
                        <th scope="col">Status</th>
                        <th scope="col" colspan="2">Actions</th>
        </tr>
        </thead>

        <tbody>
        @for (buildSchedule of buildSchedules; track buildSchedule.buildScheduleId) {
            <tr
                    class="text-center">

                                <td class="align-middle">
                    {{ buildSchedule.scheduleNumber }}
                </td>
                                <td class="align-middle">
                    {{ buildSchedule.Status }}
                </td>
                
                <td class="align-middle">
                    <a
                            [routerLink]="['/loadBuildSchedule', buildSchedule.buildScheduleId]"
                            class="btn btn-primary btn-sm">
                        Edit
                    </a>
                </td>

                <td class="align-middle">
                    <button
                            type="button"
                            (click)="deleteBuildSchedule(buildSchedule.buildScheduleId)"
                            class="btn btn-danger btn-sm">
                        Delete
                    </button>
                </td>

            </tr>
        }

        
        @if (buildSchedules?.length === 0) {
            <tr>
                <td
                        colspan="4"
                        class="text-center">
                    No buildSchedules found.
                </td>
            </tr>
        }

        </tbody>
    </table>
</div>
