
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">LandingGear List</h5>

    <a
            [routerLink]="['/createLandingGear']"
            class="btn btn-primary btn-sm">
        Create LandingGear
    </a>
</div>

<div class="table-responsive">
    <table class="table table-hover table-striped table-bordered table-sm">
        <thead>
        <tr class="table-dark text-center">
                                    <th scope="col">supplierPartNumber</th>
                        <th scope="col">GearType</th>
                        <th scope="col" colspan="2">Actions</th>
        </tr>
        </thead>

        <tbody>
        @for (landingGear of landingGears; track landingGear.landingGearId) {
            <tr
                    class="text-center">

                                <td class="align-middle">
                    {{ landingGear.supplierPartNumber }}
                </td>
                                <td class="align-middle">
                    {{ landingGear.GearType }}
                </td>
                
                <td class="align-middle">
                    <a
                            [routerLink]="['/loadLandingGear', landingGear.landingGearId]"
                            class="btn btn-primary btn-sm">
                        Edit
                    </a>
                </td>

                <td class="align-middle">
                    <button
                            type="button"
                            (click)="deleteLandingGear(landingGear.landingGearId)"
                            class="btn btn-danger btn-sm">
                        Delete
                    </button>
                </td>

            </tr>
        }

        
        @if (landingGears?.length === 0) {
            <tr>
                <td
                        colspan="4"
                        class="text-center">
                    No landingGears found.
                </td>
            </tr>
        }

        </tbody>
    </table>
</div>
