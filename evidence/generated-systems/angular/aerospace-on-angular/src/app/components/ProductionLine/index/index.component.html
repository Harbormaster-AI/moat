
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">ProductionLine List</h5>

    <a
            [routerLink]="['/createProductionLine']"
            class="btn btn-primary btn-sm">
        Create ProductionLine
    </a>
</div>

<div class="table-responsive">
    <table class="table table-hover table-striped table-bordered table-sm">
        <thead>
        <tr class="table-dark text-center">
                                    <th scope="col">name</th>
                        <th scope="col">LineType</th>
                        <th scope="col" colspan="2">Actions</th>
        </tr>
        </thead>

        <tbody>
        @for (productionLine of productionLines; track productionLine.productionLineId) {
            <tr
                    class="text-center">

                                <td class="align-middle">
                    {{ productionLine.name }}
                </td>
                                <td class="align-middle">
                    {{ productionLine.LineType }}
                </td>
                
                <td class="align-middle">
                    <a
                            [routerLink]="['/loadProductionLine', productionLine.productionLineId]"
                            class="btn btn-primary btn-sm">
                        Edit
                    </a>
                </td>

                <td class="align-middle">
                    <button
                            type="button"
                            (click)="deleteProductionLine(productionLine.productionLineId)"
                            class="btn btn-danger btn-sm">
                        Delete
                    </button>
                </td>

            </tr>
        }

        
        @if (productionLines?.length === 0) {
            <tr>
                <td
                        colspan="4"
                        class="text-center">
                    No productionLines found.
                </td>
            </tr>
        }

        </tbody>
    </table>
</div>
