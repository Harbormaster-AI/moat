
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">ProductionOrder List</h5>

    <a
            [routerLink]="['/createProductionOrder']"
            class="btn btn-primary btn-sm">
        Create ProductionOrder
    </a>
</div>

<div class="table-responsive">
    <table class="table table-hover table-striped table-bordered table-sm">
        <thead>
        <tr class="table-dark text-center">
                                    <th scope="col">orderNumber</th>
                        <th scope="col">Status</th>
                        <th scope="col" colspan="2">Actions</th>
        </tr>
        </thead>

        <tbody>
        @for (productionOrder of productionOrders; track productionOrder.productionOrderId) {
            <tr
                    class="text-center">

                                <td class="align-middle">
                    {{ productionOrder.orderNumber }}
                </td>
                                <td class="align-middle">
                    {{ productionOrder.Status }}
                </td>
                
                <td class="align-middle">
                    <a
                            [routerLink]="['/loadProductionOrder', productionOrder.productionOrderId]"
                            class="btn btn-primary btn-sm">
                        Edit
                    </a>
                </td>

                <td class="align-middle">
                    <button
                            type="button"
                            (click)="deleteProductionOrder(productionOrder.productionOrderId)"
                            class="btn btn-danger btn-sm">
                        Delete
                    </button>
                </td>

            </tr>
        }

        
        @if (productionOrders?.length === 0) {
            <tr>
                <td
                        colspan="4"
                        class="text-center">
                    No productionOrders found.
                </td>
            </tr>
        }

        </tbody>
    </table>
</div>
