
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">SalesCampaign List</h5>

    <a
            [routerLink]="['/createSalesCampaign']"
            class="btn btn-primary btn-sm">
        Create SalesCampaign
    </a>
</div>

<div class="table-responsive">
    <table class="table table-hover table-striped table-bordered table-sm">
        <thead>
        <tr class="table-dark text-center">
                                    <th scope="col">campaignCode</th>
                        <th scope="col">Status</th>
                        <th scope="col" colspan="2">Actions</th>
        </tr>
        </thead>

        <tbody>
        @for (salesCampaign of salesCampaigns; track salesCampaign.salesCampaignId) {
            <tr
                    class="text-center">

                                <td class="align-middle">
                    {{ salesCampaign.campaignCode }}
                </td>
                                <td class="align-middle">
                    {{ salesCampaign.Status }}
                </td>
                
                <td class="align-middle">
                    <a
                            [routerLink]="['/loadSalesCampaign', salesCampaign.salesCampaignId]"
                            class="btn btn-primary btn-sm">
                        Edit
                    </a>
                </td>

                <td class="align-middle">
                    <button
                            type="button"
                            (click)="deleteSalesCampaign(salesCampaign.salesCampaignId)"
                            class="btn btn-danger btn-sm">
                        Delete
                    </button>
                </td>

            </tr>
        }

        
        @if (salesCampaigns?.length === 0) {
            <tr>
                <td
                        colspan="4"
                        class="text-center">
                    No salesCampaigns found.
                </td>
            </tr>
        }

        </tbody>
    </table>
</div>
