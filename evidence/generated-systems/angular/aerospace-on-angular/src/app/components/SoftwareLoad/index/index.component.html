
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">SoftwareLoad List</h5>

    <a
            [routerLink]="['/createSoftwareLoad']"
            class="btn btn-primary btn-sm">
        Create SoftwareLoad
    </a>
</div>

<div class="table-responsive">
    <table class="table table-hover table-striped table-bordered table-sm">
        <thead>
        <tr class="table-dark text-center">
                                    <th scope="col">version</th>
                        <th scope="col">LoadType</th>
                        <th scope="col" colspan="2">Actions</th>
        </tr>
        </thead>

        <tbody>
        @for (softwareLoad of softwareLoads; track softwareLoad.softwareLoadId) {
            <tr
                    class="text-center">

                                <td class="align-middle">
                    {{ softwareLoad.version }}
                </td>
                                <td class="align-middle">
                    {{ softwareLoad.LoadType }}
                </td>
                
                <td class="align-middle">
                    <a
                            [routerLink]="['/loadSoftwareLoad', softwareLoad.softwareLoadId]"
                            class="btn btn-primary btn-sm">
                        Edit
                    </a>
                </td>

                <td class="align-middle">
                    <button
                            type="button"
                            (click)="deleteSoftwareLoad(softwareLoad.softwareLoadId)"
                            class="btn btn-danger btn-sm">
                        Delete
                    </button>
                </td>

            </tr>
        }

        
        @if (softwareLoads?.length === 0) {
            <tr>
                <td
                        colspan="4"
                        class="text-center">
                    No softwareLoads found.
                </td>
            </tr>
        }

        </tbody>
    </table>
</div>
