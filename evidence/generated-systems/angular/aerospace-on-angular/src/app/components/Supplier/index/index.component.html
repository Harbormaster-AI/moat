
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">Supplier List</h5>

    <a
            [routerLink]="['/createSupplier']"
            class="btn btn-primary btn-sm">
        Create Supplier
    </a>
</div>

<div class="table-responsive">
    <table class="table table-hover table-striped table-bordered table-sm">
        <thead>
        <tr class="table-dark text-center">
                                    <th scope="col">name</th>
                        <th scope="col">SupplierType</th>
                        <th scope="col">ApprovalStatus</th>
                        <th scope="col" colspan="2">Actions</th>
        </tr>
        </thead>

        <tbody>
        @for (supplier of suppliers; track supplier.supplierId) {
            <tr
                    class="text-center">

                                <td class="align-middle">
                    {{ supplier.name }}
                </td>
                                <td class="align-middle">
                    {{ supplier.SupplierType }}
                </td>
                                <td class="align-middle">
                    {{ supplier.ApprovalStatus }}
                </td>
                
                <td class="align-middle">
                    <a
                            [routerLink]="['/loadSupplier', supplier.supplierId]"
                            class="btn btn-primary btn-sm">
                        Edit
                    </a>
                </td>

                <td class="align-middle">
                    <button
                            type="button"
                            (click)="deleteSupplier(supplier.supplierId)"
                            class="btn btn-danger btn-sm">
                        Delete
                    </button>
                </td>

            </tr>
        }

        
        @if (suppliers?.length === 0) {
            <tr>
                <td
                        colspan="5"
                        class="text-center">
                    No suppliers found.
                </td>
            </tr>
        }

        </tbody>
    </table>
</div>
