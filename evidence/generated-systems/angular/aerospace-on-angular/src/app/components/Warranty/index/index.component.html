
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">Warranty List</h5>

    <a
            [routerLink]="['/createWarranty']"
            class="btn btn-primary btn-sm">
        Create Warranty
    </a>
</div>

<div class="table-responsive">
    <table class="table table-hover table-striped table-bordered table-sm">
        <thead>
        <tr class="table-dark text-center">
                                    <th scope="col">coverageMonths</th>
                        <th scope="col">WarrantyType</th>
                        <th scope="col" colspan="2">Actions</th>
        </tr>
        </thead>

        <tbody>
        @for (warranty of warrantys; track warranty.warrantyId) {
            <tr
                    class="text-center">

                                <td class="align-middle">
                    {{ warranty.coverageMonths }}
                </td>
                                <td class="align-middle">
                    {{ warranty.WarrantyType }}
                </td>
                
                <td class="align-middle">
                    <a
                            [routerLink]="['/loadWarranty', warranty.warrantyId]"
                            class="btn btn-primary btn-sm">
                        Edit
                    </a>
                </td>

                <td class="align-middle">
                    <button
                            type="button"
                            (click)="deleteWarranty(warranty.warrantyId)"
                            class="btn btn-danger btn-sm">
                        Delete
                    </button>
                </td>

            </tr>
        }

        
        @if (warrantys?.length === 0) {
            <tr>
                <td
                        colspan="4"
                        class="text-center">
                    No warrantys found.
                </td>
            </tr>
        }

        </tbody>
    </table>
</div>
