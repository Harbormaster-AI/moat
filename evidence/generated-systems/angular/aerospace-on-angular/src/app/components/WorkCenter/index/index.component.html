
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">WorkCenter List</h5>

    <a
            [routerLink]="['/createWorkCenter']"
            class="btn btn-primary btn-sm">
        Create WorkCenter
    </a>
</div>

<div class="table-responsive">
    <table class="table table-hover table-striped table-bordered table-sm">
        <thead>
        <tr class="table-dark text-center">
                                    <th scope="col">name</th>
                        <th scope="col">capability</th>
                        <th scope="col" colspan="2">Actions</th>
        </tr>
        </thead>

        <tbody>
        @for (workCenter of workCenters; track workCenter.workCenterId) {
            <tr
                    class="text-center">

                                <td class="align-middle">
                    {{ workCenter.name }}
                </td>
                                <td class="align-middle">
                    {{ workCenter.capability }}
                </td>
                
                <td class="align-middle">
                    <a
                            [routerLink]="['/loadWorkCenter', workCenter.workCenterId]"
                            class="btn btn-primary btn-sm">
                        Edit
                    </a>
                </td>

                <td class="align-middle">
                    <button
                            type="button"
                            (click)="deleteWorkCenter(workCenter.workCenterId)"
                            class="btn btn-danger btn-sm">
                        Delete
                    </button>
                </td>

            </tr>
        }

        
        @if (workCenters?.length === 0) {
            <tr>
                <td
                        colspan="4"
                        class="text-center">
                    No workCenters found.
                </td>
            </tr>
        }

        </tbody>
    </table>
</div>
