
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">Dashboard List</h5>

    <a
            [routerLink]="['/createDashboard']"
            class="btn btn-primary btn-sm">
        Create Dashboard
    </a>
</div>

<div class="table-responsive">
    <table class="table table-hover table-striped table-bordered table-sm">
        <thead>
        <tr class="table-dark text-center">
                                    <th scope="col">title</th>
                        <th scope="col">theme</th>
                        <th scope="col">Status</th>
                        <th scope="col" colspan="2">Actions</th>
        </tr>
        </thead>

        <tbody>
        @for (dashboard of dashboards; track dashboard.dashboardId) {
            <tr
                    class="text-center">

                                <td class="align-middle">
                    {{ dashboard.title }}
                </td>
                                <td class="align-middle">
                    {{ dashboard.theme }}
                </td>
                                <td class="align-middle">
                    {{ dashboard.Status }}
                </td>
                
                <td class="align-middle">
                    <a
                            [routerLink]="['/loadDashboard', dashboard.dashboardId]"
                            class="btn btn-primary btn-sm">
                        Edit
                    </a>
                </td>

                <td class="align-middle">
                    <button
                            type="button"
                            (click)="deleteDashboard(dashboard.dashboardId)"
                            class="btn btn-danger btn-sm">
                        Delete
                    </button>
                </td>

            </tr>
        }

        
        @if (dashboards?.length === 0) {
            <tr>
                <td
                        colspan="5"
                        class="text-center">
                    No dashboards found.
                </td>
            </tr>
        }

        </tbody>
    </table>
</div>
