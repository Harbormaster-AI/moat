
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">DataTask List</h5>

    <a
            [routerLink]="['/createDataTask']"
            class="btn btn-primary btn-sm">
        Create DataTask
    </a>
</div>

<div class="table-responsive">
    <table class="table table-hover table-striped table-bordered table-sm">
        <thead>
        <tr class="table-dark text-center">
                                    <th scope="col">name</th>
                        <th scope="col">command</th>
                        <th scope="col">retries</th>
                        <th scope="col">TaskType</th>
                        <th scope="col" colspan="2">Actions</th>
        </tr>
        </thead>

        <tbody>
        @for (dataTask of dataTasks; track dataTask.dataTaskId) {
            <tr
                    class="text-center">

                                <td class="align-middle">
                    {{ dataTask.name }}
                </td>
                                <td class="align-middle">
                    {{ dataTask.command }}
                </td>
                                <td class="align-middle">
                    {{ dataTask.retries }}
                </td>
                                <td class="align-middle">
                    {{ dataTask.TaskType }}
                </td>
                
                <td class="align-middle">
                    <a
                            [routerLink]="['/loadDataTask', dataTask.dataTaskId]"
                            class="btn btn-primary btn-sm">
                        Edit
                    </a>
                </td>

                <td class="align-middle">
                    <button
                            type="button"
                            (click)="deleteDataTask(dataTask.dataTaskId)"
                            class="btn btn-danger btn-sm">
                        Delete
                    </button>
                </td>

            </tr>
        }

        
        @if (dataTasks?.length === 0) {
            <tr>
                <td
                        colspan="6"
                        class="text-center">
                    No dataTasks found.
                </td>
            </tr>
        }

        </tbody>
    </table>
</div>
