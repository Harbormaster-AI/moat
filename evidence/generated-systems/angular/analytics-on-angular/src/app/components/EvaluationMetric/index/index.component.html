
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">EvaluationMetric List</h5>

    <a
            [routerLink]="['/createEvaluationMetric']"
            class="btn btn-primary btn-sm">
        Create EvaluationMetric
    </a>
</div>

<div class="table-responsive">
    <table class="table table-hover table-striped table-bordered table-sm">
        <thead>
        <tr class="table-dark text-center">
                                    <th scope="col">name</th>
                        <th scope="col">value</th>
                        <th scope="col" colspan="2">Actions</th>
        </tr>
        </thead>

        <tbody>
        @for (evaluationMetric of evaluationMetrics; track evaluationMetric.evaluationMetricId) {
            <tr
                    class="text-center">

                                <td class="align-middle">
                    {{ evaluationMetric.name }}
                </td>
                                <td class="align-middle">
                    {{ evaluationMetric.value }}
                </td>
                
                <td class="align-middle">
                    <a
                            [routerLink]="['/loadEvaluationMetric', evaluationMetric.evaluationMetricId]"
                            class="btn btn-primary btn-sm">
                        Edit
                    </a>
                </td>

                <td class="align-middle">
                    <button
                            type="button"
                            (click)="deleteEvaluationMetric(evaluationMetric.evaluationMetricId)"
                            class="btn btn-danger btn-sm">
                        Delete
                    </button>
                </td>

            </tr>
        }

        
        @if (evaluationMetrics?.length === 0) {
            <tr>
                <td
                        colspan="4"
                        class="text-center">
                    No evaluationMetrics found.
                </td>
            </tr>
        }

        </tbody>
    </table>
</div>
