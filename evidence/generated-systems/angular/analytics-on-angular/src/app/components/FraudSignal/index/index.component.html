
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">FraudSignal List</h5>

    <a
            [routerLink]="['/createFraudSignal']"
            class="btn btn-primary btn-sm">
        Create FraudSignal
    </a>
</div>

<div class="table-responsive">
    <table class="table table-hover table-striped table-bordered table-sm">
        <thead>
        <tr class="table-dark text-center">
                                    <th scope="col">name</th>
                        <th scope="col">ruleLogic</th>
                        <th scope="col">SignalType</th>
                        <th scope="col" colspan="2">Actions</th>
        </tr>
        </thead>

        <tbody>
        @for (fraudSignal of fraudSignals; track fraudSignal.fraudSignalId) {
            <tr
                    class="text-center">

                                <td class="align-middle">
                    {{ fraudSignal.name }}
                </td>
                                <td class="align-middle">
                    {{ fraudSignal.ruleLogic }}
                </td>
                                <td class="align-middle">
                    {{ fraudSignal.SignalType }}
                </td>
                
                <td class="align-middle">
                    <a
                            [routerLink]="['/loadFraudSignal', fraudSignal.fraudSignalId]"
                            class="btn btn-primary btn-sm">
                        Edit
                    </a>
                </td>

                <td class="align-middle">
                    <button
                            type="button"
                            (click)="deleteFraudSignal(fraudSignal.fraudSignalId)"
                            class="btn btn-danger btn-sm">
                        Delete
                    </button>
                </td>

            </tr>
        }

        
        @if (fraudSignals?.length === 0) {
            <tr>
                <td
                        colspan="5"
                        class="text-center">
                    No fraudSignals found.
                </td>
            </tr>
        }

        </tbody>
    </table>
</div>
