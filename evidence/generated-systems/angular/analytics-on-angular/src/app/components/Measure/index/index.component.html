
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">Measure List</h5>

    <a
            [routerLink]="['/createMeasure']"
            class="btn btn-primary btn-sm">
        Create Measure
    </a>
</div>

<div class="table-responsive">
    <table class="table table-hover table-striped table-bordered table-sm">
        <thead>
        <tr class="table-dark text-center">
                                    <th scope="col">name</th>
                        <th scope="col">format</th>
                        <th scope="col">Aggregation</th>
                        <th scope="col" colspan="2">Actions</th>
        </tr>
        </thead>

        <tbody>
        @for (measure of measures; track measure.measureId) {
            <tr
                    class="text-center">

                                <td class="align-middle">
                    {{ measure.name }}
                </td>
                                <td class="align-middle">
                    {{ measure.format }}
                </td>
                                <td class="align-middle">
                    {{ measure.Aggregation }}
                </td>
                
                <td class="align-middle">
                    <a
                            [routerLink]="['/loadMeasure', measure.measureId]"
                            class="btn btn-primary btn-sm">
                        Edit
                    </a>
                </td>

                <td class="align-middle">
                    <button
                            type="button"
                            (click)="deleteMeasure(measure.measureId)"
                            class="btn btn-danger btn-sm">
                        Delete
                    </button>
                </td>

            </tr>
        }

        
        @if (measures?.length === 0) {
            <tr>
                <td
                        colspan="5"
                        class="text-center">
                    No measures found.
                </td>
            </tr>
        }

        </tbody>
    </table>
</div>
