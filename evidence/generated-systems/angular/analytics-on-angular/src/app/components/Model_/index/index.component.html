
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">Model_ List</h5>

    <a
            [routerLink]="['/createModel_']"
            class="btn btn-primary btn-sm">
        Create Model_
    </a>
</div>

<div class="table-responsive">
    <table class="table table-hover table-striped table-bordered table-sm">
        <thead>
        <tr class="table-dark text-center">
                                    <th scope="col">name</th>
                        <th scope="col">taskDescription</th>
                        <th scope="col">ModelType</th>
                        <th scope="col" colspan="2">Actions</th>
        </tr>
        </thead>

        <tbody>
        @for (model_ of model_s; track model_.model_Id) {
            <tr
                    class="text-center">

                                <td class="align-middle">
                    {{ model_.name }}
                </td>
                                <td class="align-middle">
                    {{ model_.taskDescription }}
                </td>
                                <td class="align-middle">
                    {{ model_.ModelType }}
                </td>
                
                <td class="align-middle">
                    <a
                            [routerLink]="['/loadModel_', model_.model_Id]"
                            class="btn btn-primary btn-sm">
                        Edit
                    </a>
                </td>

                <td class="align-middle">
                    <button
                            type="button"
                            (click)="deleteModel_(model_.model_Id)"
                            class="btn btn-danger btn-sm">
                        Delete
                    </button>
                </td>

            </tr>
        }

        
        @if (model_s?.length === 0) {
            <tr>
                <td
                        colspan="5"
                        class="text-center">
                    No model_s found.
                </td>
            </tr>
        }

        </tbody>
    </table>
</div>
