
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">Prediction List</h5>

    <a
            [routerLink]="['/createPrediction']"
            class="btn btn-primary btn-sm">
        Create Prediction
    </a>
</div>

<div class="table-responsive">
    <table class="table table-hover table-striped table-bordered table-sm">
        <thead>
        <tr class="table-dark text-center">
                                    <th scope="col">referenceKey</th>
                        <th scope="col">predictedAt</th>
                        <th scope="col">score</th>
                        <th scope="col" colspan="2">Actions</th>
        </tr>
        </thead>

        <tbody>
        @for (prediction of predictions; track prediction.predictionId) {
            <tr
                    class="text-center">

                                <td class="align-middle">
                    {{ prediction.referenceKey }}
                </td>
                                <td class="align-middle">
                    {{ prediction.predictedAt }}
                </td>
                                <td class="align-middle">
                    {{ prediction.score }}
                </td>
                
                <td class="align-middle">
                    <a
                            [routerLink]="['/loadPrediction', prediction.predictionId]"
                            class="btn btn-primary btn-sm">
                        Edit
                    </a>
                </td>

                <td class="align-middle">
                    <button
                            type="button"
                            (click)="deletePrediction(prediction.predictionId)"
                            class="btn btn-danger btn-sm">
                        Delete
                    </button>
                </td>

            </tr>
        }

        
        @if (predictions?.length === 0) {
            <tr>
                <td
                        colspan="5"
                        class="text-center">
                    No predictions found.
                </td>
            </tr>
        }

        </tbody>
    </table>
</div>
