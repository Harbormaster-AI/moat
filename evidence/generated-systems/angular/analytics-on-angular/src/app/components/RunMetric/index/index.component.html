
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">RunMetric List</h5>

    <a
            [routerLink]="['/createRunMetric']"
            class="btn btn-primary btn-sm">
        Create RunMetric
    </a>
</div>

<div class="table-responsive">
    <table class="table table-hover table-striped table-bordered table-sm">
        <thead>
        <tr class="table-dark text-center">
                                    <th scope="col">name</th>
                        <th scope="col">value</th>
                        <th scope="col" colspan="2">Actions</th>
        </tr>
        </thead>

        <tbody>
        @for (runMetric of runMetrics; track runMetric.runMetricId) {
            <tr
                    class="text-center">

                                <td class="align-middle">
                    {{ runMetric.name }}
                </td>
                                <td class="align-middle">
                    {{ runMetric.value }}
                </td>
                
                <td class="align-middle">
                    <a
                            [routerLink]="['/loadRunMetric', runMetric.runMetricId]"
                            class="btn btn-primary btn-sm">
                        Edit
                    </a>
                </td>

                <td class="align-middle">
                    <button
                            type="button"
                            (click)="deleteRunMetric(runMetric.runMetricId)"
                            class="btn btn-danger btn-sm">
                        Delete
                    </button>
                </td>

            </tr>
        }

        
        @if (runMetrics?.length === 0) {
            <tr>
                <td
                        colspan="4"
                        class="text-center">
                    No runMetrics found.
                </td>
            </tr>
        }

        </tbody>
    </table>
</div>
