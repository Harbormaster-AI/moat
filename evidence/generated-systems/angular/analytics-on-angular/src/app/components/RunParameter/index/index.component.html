
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">RunParameter List</h5>

    <a
            [routerLink]="['/createRunParameter']"
            class="btn btn-primary btn-sm">
        Create RunParameter
    </a>
</div>

<div class="table-responsive">
    <table class="table table-hover table-striped table-bordered table-sm">
        <thead>
        <tr class="table-dark text-center">
                                    <th scope="col">name</th>
                        <th scope="col">value</th>
                        <th scope="col" colspan="2">Actions</th>
        </tr>
        </thead>

        <tbody>
        @for (runParameter of runParameters; track runParameter.runParameterId) {
            <tr
                    class="text-center">

                                <td class="align-middle">
                    {{ runParameter.name }}
                </td>
                                <td class="align-middle">
                    {{ runParameter.value }}
                </td>
                
                <td class="align-middle">
                    <a
                            [routerLink]="['/loadRunParameter', runParameter.runParameterId]"
                            class="btn btn-primary btn-sm">
                        Edit
                    </a>
                </td>

                <td class="align-middle">
                    <button
                            type="button"
                            (click)="deleteRunParameter(runParameter.runParameterId)"
                            class="btn btn-danger btn-sm">
                        Delete
                    </button>
                </td>

            </tr>
        }

        
        @if (runParameters?.length === 0) {
            <tr>
                <td
                        colspan="4"
                        class="text-center">
                    No runParameters found.
                </td>
            </tr>
        }

        </tbody>
    </table>
</div>
