
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">Subscriber List</h5>

    <a
            [routerLink]="['/createSubscriber']"
            class="btn btn-primary btn-sm">
        Create Subscriber
    </a>
</div>

<div class="table-responsive">
    <table class="table table-hover table-striped table-bordered table-sm">
        <thead>
        <tr class="table-dark text-center">
                                    <th scope="col">name</th>
                        <th scope="col">address</th>
                        <th scope="col">Channel</th>
                        <th scope="col" colspan="2">Actions</th>
        </tr>
        </thead>

        <tbody>
        @for (subscriber of subscribers; track subscriber.subscriberId) {
            <tr
                    class="text-center">

                                <td class="align-middle">
                    {{ subscriber.name }}
                </td>
                                <td class="align-middle">
                    {{ subscriber.address }}
                </td>
                                <td class="align-middle">
                    {{ subscriber.Channel }}
                </td>
                
                <td class="align-middle">
                    <a
                            [routerLink]="['/loadSubscriber', subscriber.subscriberId]"
                            class="btn btn-primary btn-sm">
                        Edit
                    </a>
                </td>

                <td class="align-middle">
                    <button
                            type="button"
                            (click)="deleteSubscriber(subscriber.subscriberId)"
                            class="btn btn-danger btn-sm">
                        Delete
                    </button>
                </td>

            </tr>
        }

        
        @if (subscribers?.length === 0) {
            <tr>
                <td
                        colspan="5"
                        class="text-center">
                    No subscribers found.
                </td>
            </tr>
        }

        </tbody>
    </table>
</div>
