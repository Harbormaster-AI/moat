
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">PriceBook List</h5>

    <a
            [routerLink]="['/createPriceBook']"
            class="btn btn-primary btn-sm">
        Create PriceBook
    </a>
</div>

<div class="table-responsive">
    <table class="table table-hover table-striped table-bordered table-sm">
        <thead>
        <tr class="table-dark text-center">
                                    <th scope="col">name</th>
                        <th scope="col">asActive</th>
                        <th scope="col">description</th>
                        <th scope="col" colspan="2">Actions</th>
        </tr>
        </thead>

        <tbody>
        @for (priceBook of priceBooks; track priceBook.priceBookId) {
            <tr
                    class="text-center">

                                <td class="align-middle">
                    {{ priceBook.name }}
                </td>
                                <td class="align-middle">
                    {{ priceBook.asActive }}
                </td>
                                <td class="align-middle">
                    {{ priceBook.description }}
                </td>
                
                <td class="align-middle">
                    <a
                            [routerLink]="['/loadPriceBook', priceBook.priceBookId]"
                            class="btn btn-primary btn-sm">
                        Edit
                    </a>
                </td>

                <td class="align-middle">
                    <button
                            type="button"
                            (click)="deletePriceBook(priceBook.priceBookId)"
                            class="btn btn-danger btn-sm">
                        Delete
                    </button>
                </td>

            </tr>
        }

        
        @if (priceBooks?.length === 0) {
            <tr>
                <td
                        colspan="5"
                        class="text-center">
                    No priceBooks found.
                </td>
            </tr>
        }

        </tbody>
    </table>
</div>
