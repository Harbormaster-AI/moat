<div class="card">
	<div class="card-header">
		<h5 class="mb-0">{{ title }}</h5>
	</div>

	<div class="card-body">
																																																																																																<mat-form-field appearance="outline">
								<mat-label>statementNumber</mat-label>
								<input matInput ngDefaultControl placeholder="statementNumber" name="accountStatement.statementNumber" [(ngModel)]="accountStatement.statementNumber">
								<mat-hint></mat-hint>
							</mat-form-field>
																																												<p>
																																																																																				<mat-form-field appearance="outline">
								<mat-label>periodStart</mat-label>
								<input matInput ngDefaultControl [matDatepicker]="picker" placeholder="periodStart" name="accountStatement.periodStart" [(ngModel)]="accountStatement.periodStart">
								<mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
								<mat-datepicker #picker></mat-datepicker>
								<mat-hint></mat-hint>
							</mat-form-field>
																																																																	<p>
																																																																																				<mat-form-field appearance="outline">
								<mat-label>periodEnd</mat-label>
								<input matInput ngDefaultControl [matDatepicker]="picker" placeholder="periodEnd" name="accountStatement.periodEnd" [(ngModel)]="accountStatement.periodEnd">
								<mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
								<mat-datepicker #picker></mat-datepicker>
								<mat-hint></mat-hint>
							</mat-form-field>
																																																																	<p>
																																																																																				<mat-form-field appearance="outline">
								<mat-label>openingBalance</mat-label>
								<input matInput ngDefaultControl placeholder="openingBalance" name="accountStatement.openingBalance" [(ngModel)]="accountStatement.openingBalance">
								<mat-hint></mat-hint>
							</mat-form-field>
																																												<p>
																																																																																				<mat-form-field appearance="outline">
								<mat-label>closingBalance</mat-label>
								<input matInput ngDefaultControl placeholder="closingBalance" name="accountStatement.closingBalance" [(ngModel)]="accountStatement.closingBalance">
								<mat-hint></mat-hint>
							</mat-form-field>
																																												<p>
																																																																																				<ngb-timepicker [(ngModel)]="accountStatement.generatedAt" class="form-control" name="accountStatement.generatedAt" #accountStatement.generatedAt ></ngb-timepicker>
																																																																	<p>
																																																								<mat-form-field appearance="outline">
					<mat-label>Account</mat-label>
					<mat-select placeholder="Account"  [(ngModel)]="accountStatement.Account">
						@for (account of accounts; track account.accountId) {
							<mat-option name="accountStatement.Account" ngDefaultControl
							            [value]="account.accountId">
								{{account.accountNumber}}
							</mat-option>
						}
					</mat-select>
				</mat-form-field>
																	<p>
																						 																							 																							 																							 																							 																							 																										 										<button
				(click)="addAccountStatement(accountStatement.statementNumber, accountStatement.periodStart, accountStatement.periodEnd, accountStatement.openingBalance, accountStatement.closingBalance, accountStatement.generatedAt, accountStatement.Account)"
							class="btn btn-primary">add
		</button>
	</div> <!-- panel body -->
</div> <!-- panel panel-primary -->
