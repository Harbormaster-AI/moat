
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">AppliedFee List</h5>

    <a
            [routerLink]="['/createAppliedFee']"
            class="btn btn-primary btn-sm">
        Create AppliedFee
    </a>
</div>

<div class="table-responsive">
    <table class="table table-hover table-striped table-bordered table-sm">
        <thead>
        <tr class="table-dark text-center">
                                    <th scope="col">amount</th>
                        <th scope="col">description</th>
                        <th scope="col">FeeType</th>
                        <th scope="col" colspan="2">Actions</th>
        </tr>
        </thead>

        <tbody>
        @for (appliedFee of appliedFees; track appliedFee.appliedFeeId) {
            <tr
                    class="text-center">

                                <td class="align-middle">
                    {{ appliedFee.amount }}
                </td>
                                <td class="align-middle">
                    {{ appliedFee.description }}
                </td>
                                <td class="align-middle">
                    {{ appliedFee.FeeType }}
                </td>
                
                <td class="align-middle">
                    <a
                            [routerLink]="['/loadAppliedFee', appliedFee.appliedFeeId]"
                            class="btn btn-primary btn-sm">
                        Edit
                    </a>
                </td>

                <td class="align-middle">
                    <button
                            type="button"
                            (click)="deleteAppliedFee(appliedFee.appliedFeeId)"
                            class="btn btn-danger btn-sm">
                        Delete
                    </button>
                </td>

            </tr>
        }

        
        @if (appliedFees?.length === 0) {
            <tr>
                <td
                        colspan="5"
                        class="text-center">
                    No appliedFees found.
                </td>
            </tr>
        }

        </tbody>
    </table>
</div>
