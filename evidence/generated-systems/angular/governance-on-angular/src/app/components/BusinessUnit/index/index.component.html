
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">BusinessUnit List</h5>

    <a
            [routerLink]="['/createBusinessUnit']"
            class="btn btn-primary btn-sm">
        Create BusinessUnit
    </a>
</div>

<div class="table-responsive">
    <table class="table table-hover table-striped table-bordered table-sm">
        <thead>
        <tr class="table-dark text-center">
                                    <th scope="col">name</th>
                        <th scope="col">leader</th>
                        <th scope="col" colspan="2">Actions</th>
        </tr>
        </thead>

        <tbody>
        @for (businessUnit of businessUnits; track businessUnit.businessUnitId) {
            <tr
                    class="text-center">

                                <td class="align-middle">
                    {{ businessUnit.name }}
                </td>
                                <td class="align-middle">
                    {{ businessUnit.leader }}
                </td>
                
                <td class="align-middle">
                    <a
                            [routerLink]="['/loadBusinessUnit', businessUnit.businessUnitId]"
                            class="btn btn-primary btn-sm">
                        Edit
                    </a>
                </td>

                <td class="align-middle">
                    <button
                            type="button"
                            (click)="deleteBusinessUnit(businessUnit.businessUnitId)"
                            class="btn btn-danger btn-sm">
                        Delete
                    </button>
                </td>

            </tr>
        }

        
        @if (businessUnits?.length === 0) {
            <tr>
                <td
                        colspan="4"
                        class="text-center">
                    No businessUnits found.
                </td>
            </tr>
        }

        </tbody>
    </table>
</div>
