
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">RoleAssignment List</h5>

    <a
            [routerLink]="['/createRoleAssignment']"
            class="btn btn-primary btn-sm">
        Create RoleAssignment
    </a>
</div>

<div class="table-responsive">
    <table class="table table-hover table-striped table-bordered table-sm">
        <thead>
        <tr class="table-dark text-center">
                                    <th scope="col">effectiveFrom</th>
                        <th scope="col">effectiveTo</th>
                        <th scope="col" colspan="2">Actions</th>
        </tr>
        </thead>

        <tbody>
        @for (roleAssignment of roleAssignments; track roleAssignment.roleAssignmentId) {
            <tr
                    class="text-center">

                                <td class="align-middle">
                    {{ roleAssignment.effectiveFrom }}
                </td>
                                <td class="align-middle">
                    {{ roleAssignment.effectiveTo }}
                </td>
                
                <td class="align-middle">
                    <a
                            [routerLink]="['/loadRoleAssignment', roleAssignment.roleAssignmentId]"
                            class="btn btn-primary btn-sm">
                        Edit
                    </a>
                </td>

                <td class="align-middle">
                    <button
                            type="button"
                            (click)="deleteRoleAssignment(roleAssignment.roleAssignmentId)"
                            class="btn btn-danger btn-sm">
                        Delete
                    </button>
                </td>

            </tr>
        }

        
        @if (roleAssignments?.length === 0) {
            <tr>
                <td
                        colspan="4"
                        class="text-center">
                    No roleAssignments found.
                </td>
            </tr>
        }

        </tbody>
    </table>
</div>
