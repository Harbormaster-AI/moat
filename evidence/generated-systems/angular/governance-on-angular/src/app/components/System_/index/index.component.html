
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">System_ List</h5>

    <a
            [routerLink]="['/createSystem_']"
            class="btn btn-primary btn-sm">
        Create System_
    </a>
</div>

<div class="table-responsive">
    <table class="table table-hover table-striped table-bordered table-sm">
        <thead>
        <tr class="table-dark text-center">
                                    <th scope="col">name</th>
                        <th scope="col">ownerDepartment</th>
                        <th scope="col">SystemType</th>
                        <th scope="col" colspan="2">Actions</th>
        </tr>
        </thead>

        <tbody>
        @for (system_ of system_s; track system_.system_Id) {
            <tr
                    class="text-center">

                                <td class="align-middle">
                    {{ system_.name }}
                </td>
                                <td class="align-middle">
                    {{ system_.ownerDepartment }}
                </td>
                                <td class="align-middle">
                    {{ system_.SystemType }}
                </td>
                
                <td class="align-middle">
                    <a
                            [routerLink]="['/loadSystem_', system_.system_Id]"
                            class="btn btn-primary btn-sm">
                        Edit
                    </a>
                </td>

                <td class="align-middle">
                    <button
                            type="button"
                            (click)="deleteSystem_(system_.system_Id)"
                            class="btn btn-danger btn-sm">
                        Delete
                    </button>
                </td>

            </tr>
        }

        
        @if (system_s?.length === 0) {
            <tr>
                <td
                        colspan="5"
                        class="text-center">
                    No system_s found.
                </td>
            </tr>
        }

        </tbody>
    </table>
</div>
