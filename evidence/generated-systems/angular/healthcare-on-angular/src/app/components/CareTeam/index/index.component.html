
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">CareTeam List</h5>

    <a
            [routerLink]="['/createCareTeam']"
            class="btn btn-primary btn-sm">
        Create CareTeam
    </a>
</div>

<div class="table-responsive">
    <table class="table table-hover table-striped table-bordered table-sm">
        <thead>
        <tr class="table-dark text-center">
                                    <th scope="col">name</th>
                        <th scope="col">CareSetting</th>
                        <th scope="col" colspan="2">Actions</th>
        </tr>
        </thead>

        <tbody>
        @for (careTeam of careTeams; track careTeam.careTeamId) {
            <tr
                    class="text-center">

                                <td class="align-middle">
                    {{ careTeam.name }}
                </td>
                                <td class="align-middle">
                    {{ careTeam.CareSetting }}
                </td>
                
                <td class="align-middle">
                    <a
                            [routerLink]="['/loadCareTeam', careTeam.careTeamId]"
                            class="btn btn-primary btn-sm">
                        Edit
                    </a>
                </td>

                <td class="align-middle">
                    <button
                            type="button"
                            (click)="deleteCareTeam(careTeam.careTeamId)"
                            class="btn btn-danger btn-sm">
                        Delete
                    </button>
                </td>

            </tr>
        }

        
        @if (careTeams?.length === 0) {
            <tr>
                <td
                        colspan="4"
                        class="text-center">
                    No careTeams found.
                </td>
            </tr>
        }

        </tbody>
    </table>
</div>
