
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">Department List</h5>

    <a
            [routerLink]="['/createDepartment']"
            class="btn btn-primary btn-sm">
        Create Department
    </a>
</div>

<div class="table-responsive">
    <table class="table table-hover table-striped table-bordered table-sm">
        <thead>
        <tr class="table-dark text-center">
                                    <th scope="col">name</th>
                        <th scope="col">DepartmentType</th>
                        <th scope="col" colspan="2">Actions</th>
        </tr>
        </thead>

        <tbody>
        @for (department of departments; track department.departmentId) {
            <tr
                    class="text-center">

                                <td class="align-middle">
                    {{ department.name }}
                </td>
                                <td class="align-middle">
                    {{ department.DepartmentType }}
                </td>
                
                <td class="align-middle">
                    <a
                            [routerLink]="['/loadDepartment', department.departmentId]"
                            class="btn btn-primary btn-sm">
                        Edit
                    </a>
                </td>

                <td class="align-middle">
                    <button
                            type="button"
                            (click)="deleteDepartment(department.departmentId)"
                            class="btn btn-danger btn-sm">
                        Delete
                    </button>
                </td>

            </tr>
        }

        
        @if (departments?.length === 0) {
            <tr>
                <td
                        colspan="4"
                        class="text-center">
                    No departments found.
                </td>
            </tr>
        }

        </tbody>
    </table>
</div>
