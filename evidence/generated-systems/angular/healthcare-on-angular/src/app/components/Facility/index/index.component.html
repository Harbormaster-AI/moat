
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">Facility List</h5>

    <a
            [routerLink]="['/createFacility']"
            class="btn btn-primary btn-sm">
        Create Facility
    </a>
</div>

<div class="table-responsive">
    <table class="table table-hover table-striped table-bordered table-sm">
        <thead>
        <tr class="table-dark text-center">
                                    <th scope="col">name</th>
                        <th scope="col">facilityCode</th>
                        <th scope="col">address</th>
                        <th scope="col">FacilityType</th>
                        <th scope="col" colspan="2">Actions</th>
        </tr>
        </thead>

        <tbody>
        @for (facility of facilitys; track facility.facilityId) {
            <tr
                    class="text-center">

                                <td class="align-middle">
                    {{ facility.name }}
                </td>
                                <td class="align-middle">
                    {{ facility.facilityCode }}
                </td>
                                <td class="align-middle">
                    {{ facility.address }}
                </td>
                                <td class="align-middle">
                    {{ facility.FacilityType }}
                </td>
                
                <td class="align-middle">
                    <a
                            [routerLink]="['/loadFacility', facility.facilityId]"
                            class="btn btn-primary btn-sm">
                        Edit
                    </a>
                </td>

                <td class="align-middle">
                    <button
                            type="button"
                            (click)="deleteFacility(facility.facilityId)"
                            class="btn btn-danger btn-sm">
                        Delete
                    </button>
                </td>

            </tr>
        }

        
        @if (facilitys?.length === 0) {
            <tr>
                <td
                        colspan="6"
                        class="text-center">
                    No facilitys found.
                </td>
            </tr>
        }

        </tbody>
    </table>
</div>
