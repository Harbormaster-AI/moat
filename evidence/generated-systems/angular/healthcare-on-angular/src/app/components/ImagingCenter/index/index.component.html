
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">ImagingCenter List</h5>

    <a
            [routerLink]="['/createImagingCenter']"
            class="btn btn-primary btn-sm">
        Create ImagingCenter
    </a>
</div>

<div class="table-responsive">
    <table class="table table-hover table-striped table-bordered table-sm">
        <thead>
        <tr class="table-dark text-center">
                                    <th scope="col">name</th>
                        <th scope="col" colspan="2">Actions</th>
        </tr>
        </thead>

        <tbody>
        @for (imagingCenter of imagingCenters; track imagingCenter.imagingCenterId) {
            <tr
                    class="text-center">

                                <td class="align-middle">
                    {{ imagingCenter.name }}
                </td>
                
                <td class="align-middle">
                    <a
                            [routerLink]="['/loadImagingCenter', imagingCenter.imagingCenterId]"
                            class="btn btn-primary btn-sm">
                        Edit
                    </a>
                </td>

                <td class="align-middle">
                    <button
                            type="button"
                            (click)="deleteImagingCenter(imagingCenter.imagingCenterId)"
                            class="btn btn-danger btn-sm">
                        Delete
                    </button>
                </td>

            </tr>
        }

        
        @if (imagingCenters?.length === 0) {
            <tr>
                <td
                        colspan="3"
                        class="text-center">
                    No imagingCenters found.
                </td>
            </tr>
        }

        </tbody>
    </table>
</div>
