
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">LabResult List</h5>

    <a
            [routerLink]="['/createLabResult']"
            class="btn btn-primary btn-sm">
        Create LabResult
    </a>
</div>

<div class="table-responsive">
    <table class="table table-hover table-striped table-bordered table-sm">
        <thead>
        <tr class="table-dark text-center">
                                    <th scope="col">resultCode</th>
                        <th scope="col">issuedDate</th>
                        <th scope="col">Status</th>
                        <th scope="col" colspan="2">Actions</th>
        </tr>
        </thead>

        <tbody>
        @for (labResult of labResults; track labResult.labResultId) {
            <tr
                    class="text-center">

                                <td class="align-middle">
                    {{ labResult.resultCode }}
                </td>
                                <td class="align-middle">
                    {{ labResult.issuedDate }}
                </td>
                                <td class="align-middle">
                    {{ labResult.Status }}
                </td>
                
                <td class="align-middle">
                    <a
                            [routerLink]="['/loadLabResult', labResult.labResultId]"
                            class="btn btn-primary btn-sm">
                        Edit
                    </a>
                </td>

                <td class="align-middle">
                    <button
                            type="button"
                            (click)="deleteLabResult(labResult.labResultId)"
                            class="btn btn-danger btn-sm">
                        Delete
                    </button>
                </td>

            </tr>
        }

        
        @if (labResults?.length === 0) {
            <tr>
                <td
                        colspan="5"
                        class="text-center">
                    No labResults found.
                </td>
            </tr>
        }

        </tbody>
    </table>
</div>
