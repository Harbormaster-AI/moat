
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">Laboratory List</h5>

    <a
            [routerLink]="['/createLaboratory']"
            class="btn btn-primary btn-sm">
        Create Laboratory
    </a>
</div>

<div class="table-responsive">
    <table class="table table-hover table-striped table-bordered table-sm">
        <thead>
        <tr class="table-dark text-center">
                                    <th scope="col">name</th>
                        <th scope="col">cliaNumber</th>
                        <th scope="col" colspan="2">Actions</th>
        </tr>
        </thead>

        <tbody>
        @for (laboratory of laboratorys; track laboratory.laboratoryId) {
            <tr
                    class="text-center">

                                <td class="align-middle">
                    {{ laboratory.name }}
                </td>
                                <td class="align-middle">
                    {{ laboratory.cliaNumber }}
                </td>
                
                <td class="align-middle">
                    <a
                            [routerLink]="['/loadLaboratory', laboratory.laboratoryId]"
                            class="btn btn-primary btn-sm">
                        Edit
                    </a>
                </td>

                <td class="align-middle">
                    <button
                            type="button"
                            (click)="deleteLaboratory(laboratory.laboratoryId)"
                            class="btn btn-danger btn-sm">
                        Delete
                    </button>
                </td>

            </tr>
        }

        
        @if (laboratorys?.length === 0) {
            <tr>
                <td
                        colspan="4"
                        class="text-center">
                    No laboratorys found.
                </td>
            </tr>
        }

        </tbody>
    </table>
</div>
