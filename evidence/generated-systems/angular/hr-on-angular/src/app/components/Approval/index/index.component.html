
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">Approval List</h5>

    <a
            [routerLink]="['/createApproval']"
            class="btn btn-primary btn-sm">
        Create Approval
    </a>
</div>

<div class="table-responsive">
    <table class="table table-hover table-striped table-bordered table-sm">
        <thead>
        <tr class="table-dark text-center">
                                    <th scope="col">approverComment</th>
                        <th scope="col">actionDate</th>
                        <th scope="col">Status</th>
                        <th scope="col" colspan="2">Actions</th>
        </tr>
        </thead>

        <tbody>
        @for (approval of approvals; track approval.approvalId) {
            <tr
                    class="text-center">

                                <td class="align-middle">
                    {{ approval.approverComment }}
                </td>
                                <td class="align-middle">
                    {{ approval.actionDate }}
                </td>
                                <td class="align-middle">
                    {{ approval.Status }}
                </td>
                
                <td class="align-middle">
                    <a
                            [routerLink]="['/loadApproval', approval.approvalId]"
                            class="btn btn-primary btn-sm">
                        Edit
                    </a>
                </td>

                <td class="align-middle">
                    <button
                            type="button"
                            (click)="deleteApproval(approval.approvalId)"
                            class="btn btn-danger btn-sm">
                        Delete
                    </button>
                </td>

            </tr>
        }

        
        @if (approvals?.length === 0) {
            <tr>
                <td
                        colspan="5"
                        class="text-center">
                    No approvals found.
                </td>
            </tr>
        }

        </tbody>
    </table>
</div>
