<div class="card">
	<div class="card-header">
		<h5 class="mb-0">{{ title }}</h5>
	</div>

	<div class="card-body">
																																																																																																<mat-form-field appearance="outline">
								<mat-label>accountHolder</mat-label>
								<input matInput ngDefaultControl placeholder="accountHolder" name="bankAccount.accountHolder" [(ngModel)]="bankAccount.accountHolder">
								<mat-hint></mat-hint>
							</mat-form-field>
																																												<p>
																																																																																				<mat-form-field appearance="outline">
								<mat-label>bankName</mat-label>
								<input matInput ngDefaultControl placeholder="bankName" name="bankAccount.bankName" [(ngModel)]="bankAccount.bankName">
								<mat-hint></mat-hint>
							</mat-form-field>
																																												<p>
																																																																																				<mat-form-field appearance="outline">
								<mat-label>iban</mat-label>
								<input matInput ngDefaultControl placeholder="iban" name="bankAccount.iban" [(ngModel)]="bankAccount.iban">
								<mat-hint></mat-hint>
							</mat-form-field>
																																												<p>
																																																																																				<mat-form-field appearance="outline">
								<mat-label>bic</mat-label>
								<input matInput ngDefaultControl placeholder="bic" name="bankAccount.bic" [(ngModel)]="bankAccount.bic">
								<mat-hint></mat-hint>
							</mat-form-field>
																																												<p>
																																																																																				<mat-form-field appearance="outline">
								<mat-label>accountNumber</mat-label>
								<input matInput ngDefaultControl placeholder="accountNumber" name="bankAccount.accountNumber" [(ngModel)]="bankAccount.accountNumber">
								<mat-hint></mat-hint>
							</mat-form-field>
																																												<p>
																																																																																				<mat-form-field appearance="outline">
								<mat-label>routingNumber</mat-label>
								<input matInput ngDefaultControl placeholder="routingNumber" name="bankAccount.routingNumber" [(ngModel)]="bankAccount.routingNumber">
								<mat-hint></mat-hint>
							</mat-form-field>
																																												<p>
																						 																							 																							 																							 																							 																							 										<button
				(click)="addBankAccount(bankAccount.accountHolder, bankAccount.bankName, bankAccount.iban, bankAccount.bic, bankAccount.accountNumber, bankAccount.routingNumber)"
							class="btn btn-primary">add
		</button>
	</div> <!-- panel body -->
</div> <!-- panel panel-primary -->
