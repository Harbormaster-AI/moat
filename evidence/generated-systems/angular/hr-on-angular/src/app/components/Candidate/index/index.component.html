
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">Candidate List</h5>

    <a
            [routerLink]="['/createCandidate']"
            class="btn btn-primary btn-sm">
        Create Candidate
    </a>
</div>

<div class="table-responsive">
    <table class="table table-hover table-striped table-bordered table-sm">
        <thead>
        <tr class="table-dark text-center">
                                    <th scope="col">name</th>
                        <th scope="col">email</th>
                        <th scope="col">phone</th>
                        <th scope="col">Source</th>
                        <th scope="col" colspan="2">Actions</th>
        </tr>
        </thead>

        <tbody>
        @for (candidate of candidates; track candidate.candidateId) {
            <tr
                    class="text-center">

                                <td class="align-middle">
                    {{ candidate.name }}
                </td>
                                <td class="align-middle">
                    {{ candidate.email }}
                </td>
                                <td class="align-middle">
                    {{ candidate.phone }}
                </td>
                                <td class="align-middle">
                    {{ candidate.Source }}
                </td>
                
                <td class="align-middle">
                    <a
                            [routerLink]="['/loadCandidate', candidate.candidateId]"
                            class="btn btn-primary btn-sm">
                        Edit
                    </a>
                </td>

                <td class="align-middle">
                    <button
                            type="button"
                            (click)="deleteCandidate(candidate.candidateId)"
                            class="btn btn-danger btn-sm">
                        Delete
                    </button>
                </td>

            </tr>
        }

        
        @if (candidates?.length === 0) {
            <tr>
                <td
                        colspan="6"
                        class="text-center">
                    No candidates found.
                </td>
            </tr>
        }

        </tbody>
    </table>
</div>
