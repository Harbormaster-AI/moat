
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">Competency List</h5>

    <a
            [routerLink]="['/createCompetency']"
            class="btn btn-primary btn-sm">
        Create Competency
    </a>
</div>

<div class="table-responsive">
    <table class="table table-hover table-striped table-bordered table-sm">
        <thead>
        <tr class="table-dark text-center">
                                    <th scope="col">name</th>
                        <th scope="col">category</th>
                        <th scope="col" colspan="2">Actions</th>
        </tr>
        </thead>

        <tbody>
        @for (competency of competencys; track competency.competencyId) {
            <tr
                    class="text-center">

                                <td class="align-middle">
                    {{ competency.name }}
                </td>
                                <td class="align-middle">
                    {{ competency.category }}
                </td>
                
                <td class="align-middle">
                    <a
                            [routerLink]="['/loadCompetency', competency.competencyId]"
                            class="btn btn-primary btn-sm">
                        Edit
                    </a>
                </td>

                <td class="align-middle">
                    <button
                            type="button"
                            (click)="deleteCompetency(competency.competencyId)"
                            class="btn btn-danger btn-sm">
                        Delete
                    </button>
                </td>

            </tr>
        }

        
        @if (competencys?.length === 0) {
            <tr>
                <td
                        colspan="4"
                        class="text-center">
                    No competencys found.
                </td>
            </tr>
        }

        </tbody>
    </table>
</div>
