
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">CompetencyRating List</h5>

    <a
            [routerLink]="['/createCompetencyRating']"
            class="btn btn-primary btn-sm">
        Create CompetencyRating
    </a>
</div>

<div class="table-responsive">
    <table class="table table-hover table-striped table-bordered table-sm">
        <thead>
        <tr class="table-dark text-center">
                                    <th scope="col">comment</th>
                        <th scope="col">Rating</th>
                        <th scope="col" colspan="2">Actions</th>
        </tr>
        </thead>

        <tbody>
        @for (competencyRating of competencyRatings; track competencyRating.competencyRatingId) {
            <tr
                    class="text-center">

                                <td class="align-middle">
                    {{ competencyRating.comment }}
                </td>
                                <td class="align-middle">
                    {{ competencyRating.Rating }}
                </td>
                
                <td class="align-middle">
                    <a
                            [routerLink]="['/loadCompetencyRating', competencyRating.competencyRatingId]"
                            class="btn btn-primary btn-sm">
                        Edit
                    </a>
                </td>

                <td class="align-middle">
                    <button
                            type="button"
                            (click)="deleteCompetencyRating(competencyRating.competencyRatingId)"
                            class="btn btn-danger btn-sm">
                        Delete
                    </button>
                </td>

            </tr>
        }

        
        @if (competencyRatings?.length === 0) {
            <tr>
                <td
                        colspan="4"
                        class="text-center">
                    No competencyRatings found.
                </td>
            </tr>
        }

        </tbody>
    </table>
</div>
