
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">Document List</h5>

    <a
            [routerLink]="['/createDocument']"
            class="btn btn-primary btn-sm">
        Create Document
    </a>
</div>

<div class="table-responsive">
    <table class="table table-hover table-striped table-bordered table-sm">
        <thead>
        <tr class="table-dark text-center">
                                    <th scope="col">name</th>
                        <th scope="col">fileUrl</th>
                        <th scope="col">uploadedDate</th>
                        <th scope="col">DocumentType</th>
                        <th scope="col" colspan="2">Actions</th>
        </tr>
        </thead>

        <tbody>
        @for (document of documents; track document.documentId) {
            <tr
                    class="text-center">

                                <td class="align-middle">
                    {{ document.name }}
                </td>
                                <td class="align-middle">
                    {{ document.fileUrl }}
                </td>
                                <td class="align-middle">
                    {{ document.uploadedDate }}
                </td>
                                <td class="align-middle">
                    {{ document.DocumentType }}
                </td>
                
                <td class="align-middle">
                    <a
                            [routerLink]="['/loadDocument', document.documentId]"
                            class="btn btn-primary btn-sm">
                        Edit
                    </a>
                </td>

                <td class="align-middle">
                    <button
                            type="button"
                            (click)="deleteDocument(document.documentId)"
                            class="btn btn-danger btn-sm">
                        Delete
                    </button>
                </td>

            </tr>
        }

        
        @if (documents?.length === 0) {
            <tr>
                <td
                        colspan="6"
                        class="text-center">
                    No documents found.
                </td>
            </tr>
        }

        </tbody>
    </table>
</div>
