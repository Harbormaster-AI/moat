
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">JobFamily List</h5>

    <a
            [routerLink]="['/createJobFamily']"
            class="btn btn-primary btn-sm">
        Create JobFamily
    </a>
</div>

<div class="table-responsive">
    <table class="table table-hover table-striped table-bordered table-sm">
        <thead>
        <tr class="table-dark text-center">
                                    <th scope="col">name</th>
                        <th scope="col">description</th>
                        <th scope="col" colspan="2">Actions</th>
        </tr>
        </thead>

        <tbody>
        @for (jobFamily of jobFamilys; track jobFamily.jobFamilyId) {
            <tr
                    class="text-center">

                                <td class="align-middle">
                    {{ jobFamily.name }}
                </td>
                                <td class="align-middle">
                    {{ jobFamily.description }}
                </td>
                
                <td class="align-middle">
                    <a
                            [routerLink]="['/loadJobFamily', jobFamily.jobFamilyId]"
                            class="btn btn-primary btn-sm">
                        Edit
                    </a>
                </td>

                <td class="align-middle">
                    <button
                            type="button"
                            (click)="deleteJobFamily(jobFamily.jobFamilyId)"
                            class="btn btn-danger btn-sm">
                        Delete
                    </button>
                </td>

            </tr>
        }

        
        @if (jobFamilys?.length === 0) {
            <tr>
                <td
                        colspan="4"
                        class="text-center">
                    No jobFamilys found.
                </td>
            </tr>
        }

        </tbody>
    </table>
</div>
