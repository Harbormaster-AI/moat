
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">PayrollItem List</h5>

    <a
            [routerLink]="['/createPayrollItem']"
            class="btn btn-primary btn-sm">
        Create PayrollItem
    </a>
</div>

<div class="table-responsive">
    <table class="table table-hover table-striped table-bordered table-sm">
        <thead>
        <tr class="table-dark text-center">
                                    <th scope="col">amount</th>
                        <th scope="col">taxable</th>
                        <th scope="col">ItemType</th>
                        <th scope="col" colspan="2">Actions</th>
        </tr>
        </thead>

        <tbody>
        @for (payrollItem of payrollItems; track payrollItem.payrollItemId) {
            <tr
                    class="text-center">

                                <td class="align-middle">
                    {{ payrollItem.amount }}
                </td>
                                <td class="align-middle">
                    {{ payrollItem.taxable }}
                </td>
                                <td class="align-middle">
                    {{ payrollItem.ItemType }}
                </td>
                
                <td class="align-middle">
                    <a
                            [routerLink]="['/loadPayrollItem', payrollItem.payrollItemId]"
                            class="btn btn-primary btn-sm">
                        Edit
                    </a>
                </td>

                <td class="align-middle">
                    <button
                            type="button"
                            (click)="deletePayrollItem(payrollItem.payrollItemId)"
                            class="btn btn-danger btn-sm">
                        Delete
                    </button>
                </td>

            </tr>
        }

        
        @if (payrollItems?.length === 0) {
            <tr>
                <td
                        colspan="5"
                        class="text-center">
                    No payrollItems found.
                </td>
            </tr>
        }

        </tbody>
    </table>
</div>
