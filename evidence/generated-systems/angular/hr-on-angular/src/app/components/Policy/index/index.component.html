
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">Policy List</h5>

    <a
            [routerLink]="['/createPolicy']"
            class="btn btn-primary btn-sm">
        Create Policy
    </a>
</div>

<div class="table-responsive">
    <table class="table table-hover table-striped table-bordered table-sm">
        <thead>
        <tr class="table-dark text-center">
                                    <th scope="col">policyNumber</th>
                        <th scope="col">name</th>
                        <th scope="col">effectiveDate</th>
                        <th scope="col">description</th>
                        <th scope="col" colspan="2">Actions</th>
        </tr>
        </thead>

        <tbody>
        @for (policy of policys; track policy.policyId) {
            <tr
                    class="text-center">

                                <td class="align-middle">
                    {{ policy.policyNumber }}
                </td>
                                <td class="align-middle">
                    {{ policy.name }}
                </td>
                                <td class="align-middle">
                    {{ policy.effectiveDate }}
                </td>
                                <td class="align-middle">
                    {{ policy.description }}
                </td>
                
                <td class="align-middle">
                    <a
                            [routerLink]="['/loadPolicy', policy.policyId]"
                            class="btn btn-primary btn-sm">
                        Edit
                    </a>
                </td>

                <td class="align-middle">
                    <button
                            type="button"
                            (click)="deletePolicy(policy.policyId)"
                            class="btn btn-danger btn-sm">
                        Delete
                    </button>
                </td>

            </tr>
        }

        
        @if (policys?.length === 0) {
            <tr>
                <td
                        colspan="6"
                        class="text-center">
                    No policys found.
                </td>
            </tr>
        }

        </tbody>
    </table>
</div>
