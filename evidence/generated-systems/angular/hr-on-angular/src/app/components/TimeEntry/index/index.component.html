
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">TimeEntry List</h5>

    <a
            [routerLink]="['/createTimeEntry']"
            class="btn btn-primary btn-sm">
        Create TimeEntry
    </a>
</div>

<div class="table-responsive">
    <table class="table table-hover table-striped table-bordered table-sm">
        <thead>
        <tr class="table-dark text-center">
                                    <th scope="col">entryDate</th>
                        <th scope="col">hoursWorked</th>
                        <th scope="col">EntryType</th>
                        <th scope="col" colspan="2">Actions</th>
        </tr>
        </thead>

        <tbody>
        @for (timeEntry of timeEntrys; track timeEntry.timeEntryId) {
            <tr
                    class="text-center">

                                <td class="align-middle">
                    {{ timeEntry.entryDate }}
                </td>
                                <td class="align-middle">
                    {{ timeEntry.hoursWorked }}
                </td>
                                <td class="align-middle">
                    {{ timeEntry.EntryType }}
                </td>
                
                <td class="align-middle">
                    <a
                            [routerLink]="['/loadTimeEntry', timeEntry.timeEntryId]"
                            class="btn btn-primary btn-sm">
                        Edit
                    </a>
                </td>

                <td class="align-middle">
                    <button
                            type="button"
                            (click)="deleteTimeEntry(timeEntry.timeEntryId)"
                            class="btn btn-danger btn-sm">
                        Delete
                    </button>
                </td>

            </tr>
        }

        
        @if (timeEntrys?.length === 0) {
            <tr>
                <td
                        colspan="5"
                        class="text-center">
                    No timeEntrys found.
                </td>
            </tr>
        }

        </tbody>
    </table>
</div>
