
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">Beneficiary List</h5>

    <a
            [routerLink]="['/createBeneficiary']"
            class="btn btn-primary btn-sm">
        Create Beneficiary
    </a>
</div>

<div class="table-responsive">
    <table class="table table-hover table-striped table-bordered table-sm">
        <thead>
        <tr class="table-dark text-center">
                                    <th scope="col">name</th>
                        <th scope="col">share</th>
                        <th scope="col">Relationship</th>
                        <th scope="col" colspan="2">Actions</th>
        </tr>
        </thead>

        <tbody>
        @for (beneficiary of beneficiarys; track beneficiary.beneficiaryId) {
            <tr
                    class="text-center">

                                <td class="align-middle">
                    {{ beneficiary.name }}
                </td>
                                <td class="align-middle">
                    {{ beneficiary.share }}
                </td>
                                <td class="align-middle">
                    {{ beneficiary.Relationship }}
                </td>
                
                <td class="align-middle">
                    <a
                            [routerLink]="['/loadBeneficiary', beneficiary.beneficiaryId]"
                            class="btn btn-primary btn-sm">
                        Edit
                    </a>
                </td>

                <td class="align-middle">
                    <button
                            type="button"
                            (click)="deleteBeneficiary(beneficiary.beneficiaryId)"
                            class="btn btn-danger btn-sm">
                        Delete
                    </button>
                </td>

            </tr>
        }

        
        @if (beneficiarys?.length === 0) {
            <tr>
                <td
                        colspan="5"
                        class="text-center">
                    No beneficiarys found.
                </td>
            </tr>
        }

        </tbody>
    </table>
</div>
