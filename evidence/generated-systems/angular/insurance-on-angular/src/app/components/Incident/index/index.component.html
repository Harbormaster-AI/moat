
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">Incident List</h5>

    <a
            [routerLink]="['/createIncident']"
            class="btn btn-primary btn-sm">
        Create Incident
    </a>
</div>

<div class="table-responsive">
    <table class="table table-hover table-striped table-bordered table-sm">
        <thead>
        <tr class="table-dark text-center">
                                    <th scope="col">location</th>
                        <th scope="col">description</th>
                        <th scope="col">IncidentType</th>
                        <th scope="col" colspan="2">Actions</th>
        </tr>
        </thead>

        <tbody>
        @for (incident of incidents; track incident.incidentId) {
            <tr
                    class="text-center">

                                <td class="align-middle">
                    {{ incident.location }}
                </td>
                                <td class="align-middle">
                    {{ incident.description }}
                </td>
                                <td class="align-middle">
                    {{ incident.IncidentType }}
                </td>
                
                <td class="align-middle">
                    <a
                            [routerLink]="['/loadIncident', incident.incidentId]"
                            class="btn btn-primary btn-sm">
                        Edit
                    </a>
                </td>

                <td class="align-middle">
                    <button
                            type="button"
                            (click)="deleteIncident(incident.incidentId)"
                            class="btn btn-danger btn-sm">
                        Delete
                    </button>
                </td>

            </tr>
        }

        
        @if (incidents?.length === 0) {
            <tr>
                <td
                        colspan="5"
                        class="text-center">
                    No incidents found.
                </td>
            </tr>
        }

        </tbody>
    </table>
</div>
