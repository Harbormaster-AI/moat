
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">Invoice List</h5>

    <a
            [routerLink]="['/createInvoice']"
            class="btn btn-primary btn-sm">
        Create Invoice
    </a>
</div>

<div class="table-responsive">
    <table class="table table-hover table-striped table-bordered table-sm">
        <thead>
        <tr class="table-dark text-center">
                                    <th scope="col">invoiceNumber</th>
                        <th scope="col">dueDate</th>
                        <th scope="col">totalDue</th>
                        <th scope="col">Status</th>
                        <th scope="col" colspan="2">Actions</th>
        </tr>
        </thead>

        <tbody>
        @for (invoice of invoices; track invoice.invoiceId) {
            <tr
                    class="text-center">

                                <td class="align-middle">
                    {{ invoice.invoiceNumber }}
                </td>
                                <td class="align-middle">
                    {{ invoice.dueDate }}
                </td>
                                <td class="align-middle">
                    {{ invoice.totalDue }}
                </td>
                                <td class="align-middle">
                    {{ invoice.Status }}
                </td>
                
                <td class="align-middle">
                    <a
                            [routerLink]="['/loadInvoice', invoice.invoiceId]"
                            class="btn btn-primary btn-sm">
                        Edit
                    </a>
                </td>

                <td class="align-middle">
                    <button
                            type="button"
                            (click)="deleteInvoice(invoice.invoiceId)"
                            class="btn btn-danger btn-sm">
                        Delete
                    </button>
                </td>

            </tr>
        }

        
        @if (invoices?.length === 0) {
            <tr>
                <td
                        colspan="6"
                        class="text-center">
                    No invoices found.
                </td>
            </tr>
        }

        </tbody>
    </table>
</div>
