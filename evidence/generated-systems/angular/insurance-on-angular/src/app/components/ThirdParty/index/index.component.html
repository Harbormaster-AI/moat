
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">ThirdParty List</h5>

    <a
            [routerLink]="['/createThirdParty']"
            class="btn btn-primary btn-sm">
        Create ThirdParty
    </a>
</div>

<div class="table-responsive">
    <table class="table table-hover table-striped table-bordered table-sm">
        <thead>
        <tr class="table-dark text-center">
                                    <th scope="col">name</th>
                        <th scope="col">taxId</th>
                        <th scope="col">address</th>
                        <th scope="col">PartyType</th>
                        <th scope="col" colspan="2">Actions</th>
        </tr>
        </thead>

        <tbody>
        @for (thirdParty of thirdPartys; track thirdParty.thirdPartyId) {
            <tr
                    class="text-center">

                                <td class="align-middle">
                    {{ thirdParty.name }}
                </td>
                                <td class="align-middle">
                    {{ thirdParty.taxId }}
                </td>
                                <td class="align-middle">
                    {{ thirdParty.address }}
                </td>
                                <td class="align-middle">
                    {{ thirdParty.PartyType }}
                </td>
                
                <td class="align-middle">
                    <a
                            [routerLink]="['/loadThirdParty', thirdParty.thirdPartyId]"
                            class="btn btn-primary btn-sm">
                        Edit
                    </a>
                </td>

                <td class="align-middle">
                    <button
                            type="button"
                            (click)="deleteThirdParty(thirdParty.thirdPartyId)"
                            class="btn btn-danger btn-sm">
                        Delete
                    </button>
                </td>

            </tr>
        }

        
        @if (thirdPartys?.length === 0) {
            <tr>
                <td
                        colspan="6"
                        class="text-center">
                    No thirdPartys found.
                </td>
            </tr>
        }

        </tbody>
    </table>
</div>
