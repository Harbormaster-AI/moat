
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">ApiKey List</h5>

    <a
            [routerLink]="['/createApiKey']"
            class="btn btn-primary btn-sm">
        Create ApiKey
    </a>
</div>

<div class="table-responsive">
    <table class="table table-hover table-striped table-bordered table-sm">
        <thead>
        <tr class="table-dark text-center">
                                    <th scope="col">keyId</th>
                        <th scope="col">hashedSecret</th>
                        <th scope="col">createdAt</th>
                        <th scope="col">lastUsedAt</th>
                        <th scope="col" colspan="2">Actions</th>
        </tr>
        </thead>

        <tbody>
        @for (apiKey of apiKeys; track apiKey.apiKeyId) {
            <tr
                    class="text-center">

                                <td class="align-middle">
                    {{ apiKey.keyId }}
                </td>
                                <td class="align-middle">
                    {{ apiKey.hashedSecret }}
                </td>
                                <td class="align-middle">
                    {{ apiKey.createdAt }}
                </td>
                                <td class="align-middle">
                    {{ apiKey.lastUsedAt }}
                </td>
                
                <td class="align-middle">
                    <a
                            [routerLink]="['/loadApiKey', apiKey.apiKeyId]"
                            class="btn btn-primary btn-sm">
                        Edit
                    </a>
                </td>

                <td class="align-middle">
                    <button
                            type="button"
                            (click)="deleteApiKey(apiKey.apiKeyId)"
                            class="btn btn-danger btn-sm">
                        Delete
                    </button>
                </td>

            </tr>
        }

        
        @if (apiKeys?.length === 0) {
            <tr>
                <td
                        colspan="6"
                        class="text-center">
                    No apiKeys found.
                </td>
            </tr>
        }

        </tbody>
    </table>
</div>
