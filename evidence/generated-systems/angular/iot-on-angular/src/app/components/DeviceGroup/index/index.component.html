
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">DeviceGroup List</h5>

    <a
            [routerLink]="['/createDeviceGroup']"
            class="btn btn-primary btn-sm">
        Create DeviceGroup
    </a>
</div>

<div class="table-responsive">
    <table class="table table-hover table-striped table-bordered table-sm">
        <thead>
        <tr class="table-dark text-center">
                                    <th scope="col">name</th>
                        <th scope="col">criteria</th>
                        <th scope="col" colspan="2">Actions</th>
        </tr>
        </thead>

        <tbody>
        @for (deviceGroup of deviceGroups; track deviceGroup.deviceGroupId) {
            <tr
                    class="text-center">

                                <td class="align-middle">
                    {{ deviceGroup.name }}
                </td>
                                <td class="align-middle">
                    {{ deviceGroup.criteria }}
                </td>
                
                <td class="align-middle">
                    <a
                            [routerLink]="['/loadDeviceGroup', deviceGroup.deviceGroupId]"
                            class="btn btn-primary btn-sm">
                        Edit
                    </a>
                </td>

                <td class="align-middle">
                    <button
                            type="button"
                            (click)="deleteDeviceGroup(deviceGroup.deviceGroupId)"
                            class="btn btn-danger btn-sm">
                        Delete
                    </button>
                </td>

            </tr>
        }

        
        @if (deviceGroups?.length === 0) {
            <tr>
                <td
                        colspan="4"
                        class="text-center">
                    No deviceGroups found.
                </td>
            </tr>
        }

        </tbody>
    </table>
</div>
