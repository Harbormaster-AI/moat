
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">TwinTemplate List</h5>

    <a
            [routerLink]="['/createTwinTemplate']"
            class="btn btn-primary btn-sm">
        Create TwinTemplate
    </a>
</div>

<div class="table-responsive">
    <table class="table table-hover table-striped table-bordered table-sm">
        <thead>
        <tr class="table-dark text-center">
                                    <th scope="col">name</th>
                        <th scope="col">schemaUri</th>
                        <th scope="col">version</th>
                        <th scope="col" colspan="2">Actions</th>
        </tr>
        </thead>

        <tbody>
        @for (twinTemplate of twinTemplates; track twinTemplate.twinTemplateId) {
            <tr
                    class="text-center">

                                <td class="align-middle">
                    {{ twinTemplate.name }}
                </td>
                                <td class="align-middle">
                    {{ twinTemplate.schemaUri }}
                </td>
                                <td class="align-middle">
                    {{ twinTemplate.version }}
                </td>
                
                <td class="align-middle">
                    <a
                            [routerLink]="['/loadTwinTemplate', twinTemplate.twinTemplateId]"
                            class="btn btn-primary btn-sm">
                        Edit
                    </a>
                </td>

                <td class="align-middle">
                    <button
                            type="button"
                            (click)="deleteTwinTemplate(twinTemplate.twinTemplateId)"
                            class="btn btn-danger btn-sm">
                        Delete
                    </button>
                </td>

            </tr>
        }

        
        @if (twinTemplates?.length === 0) {
            <tr>
                <td
                        colspan="5"
                        class="text-center">
                    No twinTemplates found.
                </td>
            </tr>
        }

        </tbody>
    </table>
</div>
