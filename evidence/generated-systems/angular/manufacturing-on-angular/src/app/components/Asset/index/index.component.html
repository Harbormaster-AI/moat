
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">Asset List</h5>

    <a
            [routerLink]="['/createAsset']"
            class="btn btn-primary btn-sm">
        Create Asset
    </a>
</div>

<div class="table-responsive">
    <table class="table table-hover table-striped table-bordered table-sm">
        <thead>
        <tr class="table-dark text-center">
                                    <th scope="col">assetTag</th>
                        <th scope="col">assetName</th>
                        <th scope="col">commissioningDate</th>
                        <th scope="col">AssetStatus</th>
                        <th scope="col" colspan="2">Actions</th>
        </tr>
        </thead>

        <tbody>
        @for (asset of assets; track asset.assetId) {
            <tr
                    class="text-center">

                                <td class="align-middle">
                    {{ asset.assetTag }}
                </td>
                                <td class="align-middle">
                    {{ asset.assetName }}
                </td>
                                <td class="align-middle">
                    {{ asset.commissioningDate }}
                </td>
                                <td class="align-middle">
                    {{ asset.AssetStatus }}
                </td>
                
                <td class="align-middle">
                    <a
                            [routerLink]="['/loadAsset', asset.assetId]"
                            class="btn btn-primary btn-sm">
                        Edit
                    </a>
                </td>

                <td class="align-middle">
                    <button
                            type="button"
                            (click)="deleteAsset(asset.assetId)"
                            class="btn btn-danger btn-sm">
                        Delete
                    </button>
                </td>

            </tr>
        }

        
        @if (assets?.length === 0) {
            <tr>
                <td
                        colspan="6"
                        class="text-center">
                    No assets found.
                </td>
            </tr>
        }

        </tbody>
    </table>
</div>
