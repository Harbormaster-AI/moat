
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">BOMItem List</h5>

    <a
            [routerLink]="['/createBOMItem']"
            class="btn btn-primary btn-sm">
        Create BOMItem
    </a>
</div>

<div class="table-responsive">
    <table class="table table-hover table-striped table-bordered table-sm">
        <thead>
        <tr class="table-dark text-center">
                                    <th scope="col">lineNumber</th>
                        <th scope="col">quantity</th>
                        <th scope="col">scrapPercent</th>
                        <th scope="col" colspan="2">Actions</th>
        </tr>
        </thead>

        <tbody>
        @for (bOMItem of bOMItems; track bOMItem.bOMItemId) {
            <tr
                    class="text-center">

                                <td class="align-middle">
                    {{ bOMItem.lineNumber }}
                </td>
                                <td class="align-middle">
                    {{ bOMItem.quantity }}
                </td>
                                <td class="align-middle">
                    {{ bOMItem.scrapPercent }}
                </td>
                
                <td class="align-middle">
                    <a
                            [routerLink]="['/loadBOMItem', bOMItem.bOMItemId]"
                            class="btn btn-primary btn-sm">
                        Edit
                    </a>
                </td>

                <td class="align-middle">
                    <button
                            type="button"
                            (click)="deleteBOMItem(bOMItem.bOMItemId)"
                            class="btn btn-danger btn-sm">
                        Delete
                    </button>
                </td>

            </tr>
        }

        
        @if (bOMItems?.length === 0) {
            <tr>
                <td
                        colspan="5"
                        class="text-center">
                    No bOMItems found.
                </td>
            </tr>
        }

        </tbody>
    </table>
</div>
