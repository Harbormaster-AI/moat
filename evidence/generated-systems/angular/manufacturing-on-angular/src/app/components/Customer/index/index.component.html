
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">Customer List</h5>

    <a
            [routerLink]="['/createCustomer']"
            class="btn btn-primary btn-sm">
        Create Customer
    </a>
</div>

<div class="table-responsive">
    <table class="table table-hover table-striped table-bordered table-sm">
        <thead>
        <tr class="table-dark text-center">
                                    <th scope="col">name</th>
                        <th scope="col">customerCode</th>
                        <th scope="col">address</th>
                        <th scope="col">CustomerType</th>
                        <th scope="col" colspan="2">Actions</th>
        </tr>
        </thead>

        <tbody>
        @for (customer of customers; track customer.customerId) {
            <tr
                    class="text-center">

                                <td class="align-middle">
                    {{ customer.name }}
                </td>
                                <td class="align-middle">
                    {{ customer.customerCode }}
                </td>
                                <td class="align-middle">
                    {{ customer.address }}
                </td>
                                <td class="align-middle">
                    {{ customer.CustomerType }}
                </td>
                
                <td class="align-middle">
                    <a
                            [routerLink]="['/loadCustomer', customer.customerId]"
                            class="btn btn-primary btn-sm">
                        Edit
                    </a>
                </td>

                <td class="align-middle">
                    <button
                            type="button"
                            (click)="deleteCustomer(customer.customerId)"
                            class="btn btn-danger btn-sm">
                        Delete
                    </button>
                </td>

            </tr>
        }

        
        @if (customers?.length === 0) {
            <tr>
                <td
                        colspan="6"
                        class="text-center">
                    No customers found.
                </td>
            </tr>
        }

        </tbody>
    </table>
</div>
