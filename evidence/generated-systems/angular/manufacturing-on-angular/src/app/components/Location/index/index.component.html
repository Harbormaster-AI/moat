
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">Location List</h5>

    <a
            [routerLink]="['/createLocation']"
            class="btn btn-primary btn-sm">
        Create Location
    </a>
</div>

<div class="table-responsive">
    <table class="table table-hover table-striped table-bordered table-sm">
        <thead>
        <tr class="table-dark text-center">
                                    <th scope="col">locationCode</th>
                        <th scope="col">description</th>
                        <th scope="col">LocationType</th>
                        <th scope="col" colspan="2">Actions</th>
        </tr>
        </thead>

        <tbody>
        @for (location of locations; track location.locationId) {
            <tr
                    class="text-center">

                                <td class="align-middle">
                    {{ location.locationCode }}
                </td>
                                <td class="align-middle">
                    {{ location.description }}
                </td>
                                <td class="align-middle">
                    {{ location.LocationType }}
                </td>
                
                <td class="align-middle">
                    <a
                            [routerLink]="['/loadLocation', location.locationId]"
                            class="btn btn-primary btn-sm">
                        Edit
                    </a>
                </td>

                <td class="align-middle">
                    <button
                            type="button"
                            (click)="deleteLocation(location.locationId)"
                            class="btn btn-danger btn-sm">
                        Delete
                    </button>
                </td>

            </tr>
        }

        
        @if (locations?.length === 0) {
            <tr>
                <td
                        colspan="5"
                        class="text-center">
                    No locations found.
                </td>
            </tr>
        }

        </tbody>
    </table>
</div>
