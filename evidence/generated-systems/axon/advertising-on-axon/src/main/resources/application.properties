
spring.liquibase.enabled=false


# =============================================================
# debug level for AxonIQ
logging.level.io.axoniq.demo=debug

# =============================================================
# Management endpoints inclusion
# =============================================================
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=*

# =============================================================
# Axon Server
# =============================================================
axon.axonserver.enabled=false
axon.axonserver.servers=localhost

# =============================================================
# snap shot thresholds are applied per class using the default value
# =============================================================
axon.aggregate.agency.snapshot-threshold=10
axon.aggregate.team.snapshot-threshold=10
axon.aggregate.user.snapshot-threshold=10
axon.aggregate.advertiser.snapshot-threshold=10
axon.aggregate.billingProfile.snapshot-threshold=10
axon.aggregate.paymentMethod.snapshot-threshold=10
axon.aggregate.adAccount.snapshot-threshold=10
axon.aggregate.dSP.snapshot-threshold=10
axon.aggregate.campaign.snapshot-threshold=10
axon.aggregate.kPI.snapshot-threshold=10
axon.aggregate.audienceSegment.snapshot-threshold=10
axon.aggregate.dataProvider.snapshot-threshold=10
axon.aggregate.lineItem.snapshot-threshold=10
axon.aggregate.targetingProfile.snapshot-threshold=10
axon.aggregate.deviceCriterion.snapshot-threshold=10
axon.aggregate.brandSafetyPolicy.snapshot-threshold=10
axon.aggregate.contentCategory.snapshot-threshold=10
axon.aggregate.publisher.snapshot-threshold=10
axon.aggregate.inventorySource.snapshot-threshold=10
axon.aggregate.adSlot.snapshot-threshold=10
axon.aggregate.deal.snapshot-threshold=10
axon.aggregate.placement.snapshot-threshold=10
axon.aggregate.creativeAsset.snapshot-threshold=10
axon.aggregate.creativeFile.snapshot-threshold=10
axon.aggregate.creativeVariation.snapshot-threshold=10
axon.aggregate.creativeApproval.snapshot-threshold=10
axon.aggregate.trackingPixel.snapshot-threshold=10
axon.aggregate.conversionEvent.snapshot-threshold=10
axon.aggregate.performanceMetric.snapshot-threshold=10
axon.aggregate.report.snapshot-threshold=10
axon.aggregate.insertionOrder.snapshot-threshold=10
axon.aggregate.rateCard.snapshot-threshold=10
axon.aggregate.rate.snapshot-threshold=10
axon.aggregate.experiment.snapshot-threshold=10
axon.aggregate.experimentVariant.snapshot-threshold=10
axon.aggregate.geoRegion.snapshot-threshold=10

# =============================================================
# snap shot thresholds are applied per aggregate using the custom defined value
# =============================================================

# =============================================================
# this configuration is recommended by AxonIQ, assign to message
# then general and events will use that value
# =============================================================
#axon.serializer.messages=xstream
#axon.serializer.general=java
axon.serializer.events=jackson
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false



# =============================================================
# For a Distribute AxonIQ
# =============================================================

# ============================================================
# Standard Spring Boot properties to set up persistence
# =============================================================
# The name of this app:
spring.application.name=advertisingOnAxon
server.port=8080

# =============================================================
# Logging on
# =============================================================
logging.level.com.harbormaster=debug

# =============================================================
# The default profiles are "all of them"
# =============================================================
spring.profiles.active=null

 
# =============================================================
# spring jpa/hibernate params
# =============================================================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.datasource.url=jdbc:mysql://localhost:3306/banking-on-spring-boot
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=com.mysql.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=letmein2
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.id.new_generator_mappings=false

# =============================================================
# enable security support - jwt, form-login, oauth2,  apikey
# =============================================================
hm.security.authentication=

