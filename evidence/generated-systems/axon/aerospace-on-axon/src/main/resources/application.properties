
spring.liquibase.enabled=false


# =============================================================
# debug level for AxonIQ
logging.level.io.axoniq.demo=debug

# =============================================================
# Management endpoints inclusion
# =============================================================
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=*

# =============================================================
# Axon Server
# =============================================================
axon.axonserver.enabled=false
axon.axonserver.servers=localhost

# =============================================================
# snap shot thresholds are applied per class using the default value
# =============================================================
axon.aggregate.aerospaceManufacturer.snapshot-threshold=10
axon.aggregate.aircraftProgram.snapshot-threshold=10
axon.aggregate.aircraftFamily.snapshot-threshold=10
axon.aggregate.aircraftModel.snapshot-threshold=10
axon.aggregate.engineType.snapshot-threshold=10
axon.aggregate.aircraftVariant.snapshot-threshold=10
axon.aggregate.avionicsSuite.snapshot-threshold=10
axon.aggregate.aPU.snapshot-threshold=10
axon.aggregate.landingGear.snapshot-threshold=10
axon.aggregate.aircraftOption.snapshot-threshold=10
axon.aggregate.aircraftPackage.snapshot-threshold=10
axon.aggregate.supplier.snapshot-threshold=10
axon.aggregate.component_.snapshot-threshold=10
axon.aggregate.plant.snapshot-threshold=10
axon.aggregate.productionLine.snapshot-threshold=10
axon.aggregate.workCenter.snapshot-threshold=10
axon.aggregate.productionOrder.snapshot-threshold=10
axon.aggregate.buildSchedule.snapshot-threshold=10
axon.aggregate.warehouse.snapshot-threshold=10
axon.aggregate.inventoryItem.snapshot-threshold=10
axon.aggregate.operator.snapshot-threshold=10
axon.aggregate.aircraftOrder.snapshot-threshold=10
axon.aggregate.quote.snapshot-threshold=10
axon.aggregate.purchaseAgreement.snapshot-threshold=10
axon.aggregate.aircraft.snapshot-threshold=10
axon.aggregate.registration.snapshot-threshold=10
axon.aggregate.warranty.snapshot-threshold=10
axon.aggregate.cabinLayout.snapshot-threshold=10
