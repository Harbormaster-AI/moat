
spring.liquibase.enabled=false


# =============================================================
# debug level for AxonIQ
logging.level.io.axoniq.demo=debug

# =============================================================
# Management endpoints inclusion
# =============================================================
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=*

# =============================================================
# Axon Server
# =============================================================
axon.axonserver.enabled=false
axon.axonserver.servers=localhost

# =============================================================
# snap shot thresholds are applied per class using the default value
# =============================================================
axon.aggregate.analyticsWorkspace.snapshot-threshold=10
axon.aggregate.dataSource.snapshot-threshold=10
axon.aggregate.dataSet.snapshot-threshold=10
axon.aggregate.dataPipeline.snapshot-threshold=10
axon.aggregate.dataTask.snapshot-threshold=10
axon.aggregate.semanticModel.snapshot-threshold=10
axon.aggregate.dimension.snapshot-threshold=10
axon.aggregate.measure.snapshot-threshold=10
axon.aggregate.metric.snapshot-threshold=10
axon.aggregate.report.snapshot-threshold=10
axon.aggregate.dashboard.snapshot-threshold=10
axon.aggregate.visualization.snapshot-threshold=10
axon.aggregate.notebook.snapshot-threshold=10
axon.aggregate.bIQuery.snapshot-threshold=10
axon.aggregate.experiment.snapshot-threshold=10
axon.aggregate.trainingRun.snapshot-threshold=10
axon.aggregate.runMetric.snapshot-threshold=10
axon.aggregate.runParameter.snapshot-threshold=10
axon.aggregate.model.snapshot-threshold=10
axon.aggregate.modelVersion.snapshot-threshold=10
axon.aggregate.evaluationMetric.snapshot-threshold=10
axon.aggregate.featureSet.snapshot-threshold=10
axon.aggregate.feature.snapshot-threshold=10
axon.aggregate.inferenceEndpoint.snapshot-threshold=10
axon.aggregate.prediction.snapshot-threshold=10
axon.aggregate.forecast.snapshot-threshold=10
axon.aggregate.timeSeries.snapshot-threshold=10
axon.aggregate.anomaly.snapshot-threshold=10
axon.aggregate.qualityRule.snapshot-threshold=10
axon.aggregate.qualityCheck.snapshot-threshold=10
axon.aggregate.lineageNode.snapshot-threshold=10
axon.aggregate.tag.snapshot-threshold=10
axon.aggregate.accessPolicy.snapshot-threshold=10
axon.aggregate.alert.snapshot-threshold=10
axon.aggregate.subscriber.snapshot-threshold=10
axon.aggregate.businessGlossaryTerm.snapshot-threshold=10
axon.aggregate.recommendationScenario.snapshot-threshold=10
axon.aggregate.fraudScenario.snapshot-threshold=10
axon.aggregate.fraudSignal.snapshot-threshold=10

# =============================================================
# snap shot thresholds are applied per aggregate using the custom defined value
# =============================================================

# =============================================================
# this configuration is recommended by AxonIQ, assign to message
# then general and events will use that value
# =============================================================
#axon.serializer.messages=xstream
#axon.serializer.general=java
axon.serializer.events=jackson
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false



# =============================================================
# For a Distribute AxonIQ
# =============================================================

# ============================================================
# Standard Spring Boot properties to set up persistence
# =============================================================
# The name of this app:
spring.application.name=analyticsOnAxon
server.port=8080

# =============================================================
# Logging on
# =============================================================
logging.level.com.harbormaster=debug

# =============================================================
# The default profiles are "all of them"
# =============================================================
spring.profiles.active=null

 
# =============================================================
# spring jpa/hibernate params
# =============================================================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.datasource.url=jdbc:mysql://localhost:3306/banking-on-spring-boot
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=com.mysql.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=letmein2
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.id.new_generator_mappings=false

# =============================================================
# enable security support - jwt, form-login, oauth2,  apikey
# =============================================================
hm.security.authentication=

