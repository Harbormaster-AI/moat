
spring.liquibase.enabled=false


# =============================================================
# debug level for AxonIQ
logging.level.io.axoniq.demo=debug

# =============================================================
# Management endpoints inclusion
# =============================================================
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=*

# =============================================================
# Axon Server
# =============================================================
axon.axonserver.enabled=false
axon.axonserver.servers=localhost

# =============================================================
# snap shot thresholds are applied per class using the default value
# =============================================================
axon.aggregate.bank.snapshot-threshold=10
axon.aggregate.branch.snapshot-threshold=10
axon.aggregate.aTM.snapshot-threshold=10
axon.aggregate.customer.snapshot-threshold=10
axon.aggregate.kycProfile.snapshot-threshold=10
axon.aggregate.identityDocument.snapshot-threshold=10
axon.aggregate.riskAssessment.snapshot-threshold=10
axon.aggregate.screeningResult.snapshot-threshold=10
axon.aggregate.bankingProduct.snapshot-threshold=10
axon.aggregate.account.snapshot-threshold=10
axon.aggregate.accountStatement.snapshot-threshold=10
axon.aggregate.transaction.snapshot-threshold=10
axon.aggregate.externalAccount.snapshot-threshold=10
axon.aggregate.fundsTransfer.snapshot-threshold=10
axon.aggregate.standingInstruction.snapshot-threshold=10
axon.aggregate.paymentCard.snapshot-threshold=10
axon.aggregate.loanAccount.snapshot-threshold=10
axon.aggregate.repaymentSchedule.snapshot-threshold=10
axon.aggregate.loanPayment.snapshot-threshold=10
axon.aggregate.collateral.snapshot-threshold=10
axon.aggregate.feeCharge.snapshot-threshold=10
axon.aggregate.exchangeRate.snapshot-threshold=10
axon.aggregate.fXTrade.snapshot-threshold=10
axon.aggregate.dispute.snapshot-threshold=10
axon.aggregate.consent.snapshot-threshold=10
axon.aggregate.thirdPartyProvider.snapshot-threshold=10

# =============================================================
# snap shot thresholds are applied per aggregate using the custom defined value
# =============================================================

# =============================================================
# this configuration is recommended by AxonIQ, assign to message
# then general and events will use that value
# =============================================================
#axon.serializer.messages=xstream
#axon.serializer.general=java
axon.serializer.events=jackson
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false



# =============================================================
# For a Distribute AxonIQ
# =============================================================

# ============================================================
# Standard Spring Boot properties to set up persistence
# =============================================================
# The name of this app:
spring.application.name=bankingOnAxon
server.port=8080

# =============================================================
# Logging on
# =============================================================
logging.level.com.harbormaster=debug

# =============================================================
# The default profiles are "all of them"
# =============================================================
spring.profiles.active=null

 
# =============================================================
# spring jpa/hibernate params
# =============================================================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.datasource.url=jdbc:mysql://localhost:3306/banking-on-spring-boot
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=com.mysql.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=letmein2
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.id.new_generator_mappings=false

# =============================================================
# enable security support - jwt, form-login, oauth2,  apikey
# =============================================================
hm.security.authentication=

