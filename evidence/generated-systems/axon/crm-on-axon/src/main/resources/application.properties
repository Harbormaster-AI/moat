
spring.liquibase.enabled=false


# =============================================================
# debug level for AxonIQ
logging.level.io.axoniq.demo=debug

# =============================================================
# Management endpoints inclusion
# =============================================================
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=*

# =============================================================
# Axon Server
# =============================================================
axon.axonserver.enabled=false
axon.axonserver.servers=localhost

# =============================================================
# snap shot thresholds are applied per class using the default value
# =============================================================
axon.aggregate.organization.snapshot-threshold=10
axon.aggregate.user.snapshot-threshold=10
axon.aggregate.team.snapshot-threshold=10
axon.aggregate.territory.snapshot-threshold=10
axon.aggregate.account.snapshot-threshold=10
axon.aggregate.contact.snapshot-threshold=10
axon.aggregate.lead.snapshot-threshold=10
axon.aggregate.opportunity.snapshot-threshold=10
axon.aggregate.opportunityLineItem.snapshot-threshold=10
axon.aggregate.opportunityStageHistory.snapshot-threshold=10
axon.aggregate.product.snapshot-threshold=10
axon.aggregate.priceBook.snapshot-threshold=10
axon.aggregate.priceBookEntry.snapshot-threshold=10
axon.aggregate.quote.snapshot-threshold=10
axon.aggregate.quoteLineItem.snapshot-threshold=10
axon.aggregate.order.snapshot-threshold=10
axon.aggregate.orderItem.snapshot-threshold=10
axon.aggregate.contract.snapshot-threshold=10
axon.aggregate.case_.snapshot-threshold=10
axon.aggregate.activity.snapshot-threshold=10
axon.aggregate.campaign.snapshot-threshold=10
axon.aggregate.campaignMember.snapshot-threshold=10
axon.aggregate.note.snapshot-threshold=10
axon.aggregate.emailMessage.snapshot-threshold=10

# =============================================================
# snap shot thresholds are applied per aggregate using the custom defined value
# =============================================================

# =============================================================
# this configuration is recommended by AxonIQ, assign to message
# then general and events will use that value
# =============================================================
#axon.serializer.messages=xstream
#axon.serializer.general=java
axon.serializer.events=jackson
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false



# =============================================================
# For a Distribute AxonIQ
# =============================================================

# ============================================================
# Standard Spring Boot properties to set up persistence
# =============================================================
# The name of this app:
spring.application.name=crmOnAxon
server.port=8080

# =============================================================
# Logging on
# =============================================================
logging.level.com.harbormaster=debug

# =============================================================
# The default profiles are "all of them"
# =============================================================
spring.profiles.active=null

 
# =============================================================
# spring jpa/hibernate params
# =============================================================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.datasource.url=jdbc:mysql://localhost:3306/banking-on-spring-boot
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=com.mysql.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=letmein2
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.id.new_generator_mappings=false

# =============================================================
# enable security support - jwt, form-login, oauth2,  apikey
# =============================================================
hm.security.authentication=

