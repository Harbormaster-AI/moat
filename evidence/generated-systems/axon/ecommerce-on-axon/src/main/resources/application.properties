
spring.liquibase.enabled=false


# =============================================================
# debug level for AxonIQ
logging.level.io.axoniq.demo=debug

# =============================================================
# Management endpoints inclusion
# =============================================================
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=*

# =============================================================
# Axon Server
# =============================================================
axon.axonserver.enabled=false
axon.axonserver.servers=localhost

# =============================================================
# snap shot thresholds are applied per class using the default value
# =============================================================
axon.aggregate.merchant.snapshot-threshold=10
axon.aggregate.channel.snapshot-threshold=10
axon.aggregate.brand.snapshot-threshold=10
axon.aggregate.catalog.snapshot-threshold=10
axon.aggregate.category.snapshot-threshold=10
axon.aggregate.product.snapshot-threshold=10
axon.aggregate.productVariant.snapshot-threshold=10
axon.aggregate.productPricing.snapshot-threshold=10
axon.aggregate.mediaAsset.snapshot-threshold=10
axon.aggregate.fulfillmentCenter.snapshot-threshold=10
axon.aggregate.inventoryItem.snapshot-threshold=10
axon.aggregate.supplier.snapshot-threshold=10
axon.aggregate.seller.snapshot-threshold=10
axon.aggregate.customer.snapshot-threshold=10
axon.aggregate.customerAddress.snapshot-threshold=10
axon.aggregate.wishlist.snapshot-threshold=10
axon.aggregate.wishlistItem.snapshot-threshold=10
axon.aggregate.cart.snapshot-threshold=10
axon.aggregate.cartItem.snapshot-threshold=10
axon.aggregate.order.snapshot-threshold=10
axon.aggregate.orderLine.snapshot-threshold=10
axon.aggregate.payment.snapshot-threshold=10
axon.aggregate.refund.snapshot-threshold=10
axon.aggregate.shipment.snapshot-threshold=10
axon.aggregate.shipmentItem.snapshot-threshold=10
axon.aggregate.returnRequest.snapshot-threshold=10
axon.aggregate.returnItem.snapshot-threshold=10
axon.aggregate.promotion.snapshot-threshold=10
axon.aggregate.coupon.snapshot-threshold=10
axon.aggregate.couponRedemption.snapshot-threshold=10
axon.aggregate.taxRule.snapshot-threshold=10
axon.aggregate.shippingMethod.snapshot-threshold=10
axon.aggregate.carrierService.snapshot-threshold=10
axon.aggregate.review.snapshot-threshold=10
axon.aggregate.subscription.snapshot-threshold=10
axon.aggregate.paymentProvider.snapshot-threshold=10
axon.aggregate.invoice.snapshot-threshold=10
axon.aggregate.giftCard.snapshot-threshold=10
axon.aggregate.giftCardRedemption.snapshot-threshold=10
axon.aggregate.payout.snapshot-threshold=10

# =============================================================
# snap shot thresholds are applied per aggregate using the custom defined value
# =============================================================

# =============================================================
# this configuration is recommended by AxonIQ, assign to message
# then general and events will use that value
# =============================================================
#axon.serializer.messages=xstream
#axon.serializer.general=java
axon.serializer.events=jackson
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false



# =============================================================
# For a Distribute AxonIQ
# =============================================================

# ============================================================
# Standard Spring Boot properties to set up persistence
# =============================================================
# The name of this app:
spring.application.name=ecommerceOnAxon
server.port=8080

# =============================================================
# Logging on
# =============================================================
logging.level.com.harbormaster=debug

# =============================================================
# The default profiles are "all of them"
# =============================================================
spring.profiles.active=null

 
# =============================================================
# spring jpa/hibernate params
# =============================================================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.datasource.url=jdbc:mysql://localhost:3306/banking-on-spring-boot
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=com.mysql.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=letmein2
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.id.new_generator_mappings=false

# =============================================================
# enable security support - jwt, form-login, oauth2,  apikey
# =============================================================
hm.security.authentication=

