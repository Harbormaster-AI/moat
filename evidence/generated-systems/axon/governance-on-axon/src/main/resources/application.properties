
spring.liquibase.enabled=false


# =============================================================
# debug level for AxonIQ
logging.level.io.axoniq.demo=debug

# =============================================================
# Management endpoints inclusion
# =============================================================
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=*

# =============================================================
# Axon Server
# =============================================================
axon.axonserver.enabled=false
axon.axonserver.servers=localhost

# =============================================================
# snap shot thresholds are applied per class using the default value
# =============================================================
axon.aggregate.organization.snapshot-threshold=10
axon.aggregate.governanceBody.snapshot-threshold=10
axon.aggregate.person.snapshot-threshold=10
axon.aggregate.role.snapshot-threshold=10
axon.aggregate.roleAssignment.snapshot-threshold=10
axon.aggregate.policy.snapshot-threshold=10
axon.aggregate.procedure.snapshot-threshold=10
axon.aggregate.regulation.snapshot-threshold=10
axon.aggregate.obligation.snapshot-threshold=10
axon.aggregate.control.snapshot-threshold=10
axon.aggregate.controlTest_.snapshot-threshold=10
axon.aggregate.evidence.snapshot-threshold=10
axon.aggregate.risk.snapshot-threshold=10
axon.aggregate.riskAssessment.snapshot-threshold=10
axon.aggregate.complianceProgram.snapshot-threshold=10
axon.aggregate.complianceRequirement.snapshot-threshold=10
axon.aggregate.attestation.snapshot-threshold=10
axon.aggregate.auditProgram.snapshot-threshold=10
axon.aggregate.auditEngagement.snapshot-threshold=10
axon.aggregate.auditWorkpaper.snapshot-threshold=10
axon.aggregate.auditFinding.snapshot-threshold=10
axon.aggregate.correctiveAction.snapshot-threshold=10
axon.aggregate.issue.snapshot-threshold=10
axon.aggregate.businessUnit.snapshot-threshold=10
axon.aggregate.dataProcessingActivity.snapshot-threshold=10
axon.aggregate.dataCategory.snapshot-threshold=10
axon.aggregate.system_.snapshot-threshold=10
axon.aggregate.privacyNotice.snapshot-threshold=10
axon.aggregate.dataSubjectRequest.snapshot-threshold=10
axon.aggregate.recordsRepository.snapshot-threshold=10
axon.aggregate.record_.snapshot-threshold=10
axon.aggregate.retentionSchedule.snapshot-threshold=10
axon.aggregate.dispositionReview.snapshot-threshold=10
axon.aggregate.legalHold.snapshot-threshold=10
axon.aggregate.matter.snapshot-threshold=10
axon.aggregate.thirdParty.snapshot-threshold=10
axon.aggregate.thirdPartyAssessment.snapshot-threshold=10
axon.aggregate.contract.snapshot-threshold=10
axon.aggregate.exception_.snapshot-threshold=10
axon.aggregate.consent.snapshot-threshold=10
axon.aggregate.dataBreach.snapshot-threshold=10

# =============================================================
# snap shot thresholds are applied per aggregate using the custom defined value
# =============================================================

# =============================================================
# this configuration is recommended by AxonIQ, assign to message
# then general and events will use that value
# =============================================================
#axon.serializer.messages=xstream
#axon.serializer.general=java
axon.serializer.events=jackson
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false



# =============================================================
# For a Distribute AxonIQ
# =============================================================

# ============================================================
# Standard Spring Boot properties to set up persistence
# =============================================================
# The name of this app:
spring.application.name=governanceOnAxon
server.port=8080

# =============================================================
# Logging on
# =============================================================
logging.level.com.harbormaster=debug

# =============================================================
# The default profiles are "all of them"
# =============================================================
spring.profiles.active=null

 
# =============================================================
# spring jpa/hibernate params
# =============================================================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.datasource.url=jdbc:mysql://localhost:3306/banking-on-spring-boot
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=com.mysql.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=letmein2
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.id.new_generator_mappings=false

# =============================================================
# enable security support - jwt, form-login, oauth2,  apikey
# =============================================================
hm.security.authentication=

