
spring.liquibase.enabled=false


# =============================================================
# debug level for AxonIQ
logging.level.io.axoniq.demo=debug

# =============================================================
# Management endpoints inclusion
# =============================================================
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=*

# =============================================================
# Axon Server
# =============================================================
axon.axonserver.enabled=false
axon.axonserver.servers=localhost

# =============================================================
# snap shot thresholds are applied per class using the default value
# =============================================================
axon.aggregate.healthSystem.snapshot-threshold=10
axon.aggregate.facility.snapshot-threshold=10
axon.aggregate.department.snapshot-threshold=10
axon.aggregate.careTeam.snapshot-threshold=10
axon.aggregate.clinician.snapshot-threshold=10
axon.aggregate.patient.snapshot-threshold=10
axon.aggregate.appointment.snapshot-threshold=10
axon.aggregate.encounter.snapshot-threshold=10
axon.aggregate.admission.snapshot-threshold=10
axon.aggregate.discharge.snapshot-threshold=10
axon.aggregate.clinicalOrder.snapshot-threshold=10
axon.aggregate.medicationOrder.snapshot-threshold=10
axon.aggregate.laboratory.snapshot-threshold=10
axon.aggregate.laboratoryOrder.snapshot-threshold=10
axon.aggregate.labResult.snapshot-threshold=10
axon.aggregate.imagingCenter.snapshot-threshold=10
axon.aggregate.imagingOrder.snapshot-threshold=10
axon.aggregate.imagingReport.snapshot-threshold=10
axon.aggregate.procedureOrder.snapshot-threshold=10
axon.aggregate.procedure.snapshot-threshold=10
axon.aggregate.pharmacy.snapshot-threshold=10
axon.aggregate.medicationDispense.snapshot-threshold=10
axon.aggregate.diagnosis.snapshot-threshold=10
axon.aggregate.observation.snapshot-threshold=10
axon.aggregate.carePlan.snapshot-threshold=10
axon.aggregate.careTask.snapshot-threshold=10
axon.aggregate.allergy.snapshot-threshold=10
axon.aggregate.condition.snapshot-threshold=10
axon.aggregate.insurancePayer.snapshot-threshold=10
axon.aggregate.insurancePlan.snapshot-threshold=10
axon.aggregate.coverage.snapshot-threshold=10
axon.aggregate.claim.snapshot-threshold=10
axon.aggregate.authorization.snapshot-threshold=10
axon.aggregate.invoice.snapshot-threshold=10
axon.aggregate.payment.snapshot-threshold=10
axon.aggregate.medicalDevice.snapshot-threshold=10
axon.aggregate.softwareUpdate.snapshot-threshold=10
axon.aggregate.medicalSupplier.snapshot-threshold=10
axon.aggregate.inventoryItem.snapshot-threshold=10

# =============================================================
# snap shot thresholds are applied per aggregate using the custom defined value
# =============================================================

# =============================================================
# this configuration is recommended by AxonIQ, assign to message
# then general and events will use that value
# =============================================================
#axon.serializer.messages=xstream
#axon.serializer.general=java
axon.serializer.events=jackson
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false



# =============================================================
# For a Distribute AxonIQ
# =============================================================

# ============================================================
# Standard Spring Boot properties to set up persistence
# =============================================================
# The name of this app:
spring.application.name=healthcareOnAxon
server.port=8080

# =============================================================
# Logging on
# =============================================================
logging.level.com.harbormaster=debug

# =============================================================
# The default profiles are "all of them"
# =============================================================
spring.profiles.active=null

 
# =============================================================
# spring jpa/hibernate params
# =============================================================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.datasource.url=jdbc:mysql://localhost:3306/banking-on-spring-boot
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=com.mysql.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=letmein2
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.id.new_generator_mappings=false

# =============================================================
# enable security support - jwt, form-login, oauth2,  apikey
# =============================================================
hm.security.authentication=

