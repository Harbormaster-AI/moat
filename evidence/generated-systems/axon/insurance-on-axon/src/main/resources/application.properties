
spring.liquibase.enabled=false


# =============================================================
# debug level for AxonIQ
logging.level.io.axoniq.demo=debug

# =============================================================
# Management endpoints inclusion
# =============================================================
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=*

# =============================================================
# Axon Server
# =============================================================
axon.axonserver.enabled=false
axon.axonserver.servers=localhost

# =============================================================
# snap shot thresholds are applied per class using the default value
# =============================================================
axon.aggregate.insurer.snapshot-threshold=10
axon.aggregate.insuranceProduct.snapshot-threshold=10
axon.aggregate.coverageDefinition.snapshot-threshold=10
axon.aggregate.distributor.snapshot-threshold=10
axon.aggregate.agent.snapshot-threshold=10
axon.aggregate.customer.snapshot-threshold=10
axon.aggregate.application.snapshot-threshold=10
axon.aggregate.quote.snapshot-threshold=10
axon.aggregate.underwritingDecision.snapshot-threshold=10
axon.aggregate.underwriter.snapshot-threshold=10
axon.aggregate.policy.snapshot-threshold=10
axon.aggregate.endorsement.snapshot-threshold=10
axon.aggregate.policyCoverage.snapshot-threshold=10
axon.aggregate.insuredObject.snapshot-threshold=10
axon.aggregate.beneficiary.snapshot-threshold=10
axon.aggregate.billingAccount.snapshot-threshold=10
axon.aggregate.invoice.snapshot-threshold=10
axon.aggregate.payment.snapshot-threshold=10
axon.aggregate.claim.snapshot-threshold=10
axon.aggregate.incident.snapshot-threshold=10
axon.aggregate.exposure.snapshot-threshold=10
axon.aggregate.adjuster.snapshot-threshold=10
axon.aggregate.claimReserve.snapshot-threshold=10
axon.aggregate.claimPayment.snapshot-threshold=10
axon.aggregate.serviceProvider.snapshot-threshold=10
axon.aggregate.reinsuranceAgreement.snapshot-threshold=10
axon.aggregate.subrogationRecovery.snapshot-threshold=10
axon.aggregate.thirdParty.snapshot-threshold=10
axon.aggregate.document.snapshot-threshold=10

# =============================================================
# snap shot thresholds are applied per aggregate using the custom defined value
# =============================================================

# =============================================================
# this configuration is recommended by AxonIQ, assign to message
# then general and events will use that value
# =============================================================
#axon.serializer.messages=xstream
#axon.serializer.general=java
axon.serializer.events=jackson
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false



# =============================================================
# For a Distribute AxonIQ
# =============================================================

# ============================================================
# Standard Spring Boot properties to set up persistence
# =============================================================
# The name of this app:
spring.application.name=insuranceOnAxon
server.port=8080

# =============================================================
# Logging on
# =============================================================
logging.level.com.harbormaster=debug

# =============================================================
# The default profiles are "all of them"
# =============================================================
spring.profiles.active=null

 
# =============================================================
# spring jpa/hibernate params
# =============================================================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.datasource.url=jdbc:mysql://localhost:3306/banking-on-spring-boot
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=com.mysql.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=letmein2
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.id.new_generator_mappings=false

# =============================================================
# enable security support - jwt, form-login, oauth2,  apikey
# =============================================================
hm.security.authentication=

