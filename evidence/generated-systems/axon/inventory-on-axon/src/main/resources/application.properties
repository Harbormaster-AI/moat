
spring.liquibase.enabled=false


# =============================================================
# debug level for AxonIQ
logging.level.io.axoniq.demo=debug

# =============================================================
# Management endpoints inclusion
# =============================================================
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=*

# =============================================================
# Axon Server
# =============================================================
axon.axonserver.enabled=false
axon.axonserver.servers=localhost

# =============================================================
# snap shot thresholds are applied per class using the default value
# =============================================================
axon.aggregate.stockKeepingUnit.snapshot-threshold=10
axon.aggregate.warehouse.snapshot-threshold=10
axon.aggregate.storageLocation.snapshot-threshold=10
axon.aggregate.inventoryItem.snapshot-threshold=10
axon.aggregate.lot.snapshot-threshold=10
axon.aggregate.serialNumber.snapshot-threshold=10
axon.aggregate.reservation.snapshot-threshold=10
axon.aggregate.demandSignal.snapshot-threshold=10
axon.aggregate.inventoryTransaction.snapshot-threshold=10
axon.aggregate.transferOrder.snapshot-threshold=10
axon.aggregate.transferOrderLine.snapshot-threshold=10
axon.aggregate.stockAdjustment.snapshot-threshold=10
axon.aggregate.stockAdjustmentLine.snapshot-threshold=10
axon.aggregate.cycleCount.snapshot-threshold=10
axon.aggregate.cycleCountEntry.snapshot-threshold=10
axon.aggregate.replenishmentPolicy.snapshot-threshold=10
axon.aggregate.uoMConversion.snapshot-threshold=10
axon.aggregate.inventoryThresholdAlert.snapshot-threshold=10
axon.aggregate.quarantine.snapshot-threshold=10
axon.aggregate.expirationPolicy.snapshot-threshold=10
axon.aggregate.inboundShipment.snapshot-threshold=10
axon.aggregate.inboundShipmentLine.snapshot-threshold=10
axon.aggregate.outboundAllocation.snapshot-threshold=10

# =============================================================
# snap shot thresholds are applied per aggregate using the custom defined value
# =============================================================

# =============================================================
# this configuration is recommended by AxonIQ, assign to message
# then general and events will use that value
# =============================================================
#axon.serializer.messages=xstream
#axon.serializer.general=java
axon.serializer.events=jackson
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false



# =============================================================
# For a Distribute AxonIQ
# =============================================================

# ============================================================
# Standard Spring Boot properties to set up persistence
# =============================================================
# The name of this app:
spring.application.name=inventoryOnAxon
server.port=8080

# =============================================================
# Logging on
# =============================================================
logging.level.com.harbormaster=debug

# =============================================================
# The default profiles are "all of them"
# =============================================================
spring.profiles.active=null

 
# =============================================================
# spring jpa/hibernate params
# =============================================================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.datasource.url=jdbc:mysql://localhost:3306/banking-on-spring-boot
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=com.mysql.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=letmein2
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.id.new_generator_mappings=false

# =============================================================
# enable security support - jwt, form-login, oauth2,  apikey
# =============================================================
hm.security.authentication=

