
spring.liquibase.enabled=false


# =============================================================
# debug level for AxonIQ
logging.level.io.axoniq.demo=debug

# =============================================================
# Management endpoints inclusion
# =============================================================
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=*

# =============================================================
# Axon Server
# =============================================================
axon.axonserver.enabled=false
axon.axonserver.servers=localhost

# =============================================================
# snap shot thresholds are applied per class using the default value
# =============================================================
axon.aggregate.deviceVendor.snapshot-threshold=10
axon.aggregate.hardwareModule.snapshot-threshold=10
axon.aggregate.deviceModel.snapshot-threshold=10
axon.aggregate.firmwareRelease.snapshot-threshold=10
axon.aggregate.ioTDevice.snapshot-threshold=10
axon.aggregate.sensorInstance.snapshot-threshold=10
axon.aggregate.actuatorInstance.snapshot-threshold=10
axon.aggregate.telemetrySchema.snapshot-threshold=10
axon.aggregate.telemetryStream.snapshot-threshold=10
axon.aggregate.commandDefinition.snapshot-threshold=10
axon.aggregate.commandInvocation.snapshot-threshold=10
axon.aggregate.alertRule.snapshot-threshold=10
axon.aggregate.alert.snapshot-threshold=10
axon.aggregate.tenant.snapshot-threshold=10
axon.aggregate.tenantUser.snapshot-threshold=10
axon.aggregate.site.snapshot-threshold=10
axon.aggregate.building.snapshot-threshold=10
axon.aggregate.floor.snapshot-threshold=10
axon.aggregate.room.snapshot-threshold=10
axon.aggregate.gateway.snapshot-threshold=10
axon.aggregate.edgeApplication.snapshot-threshold=10
axon.aggregate.networkProfile.snapshot-threshold=10
axon.aggregate.simCard.snapshot-threshold=10
axon.aggregate.connectivityPlan.snapshot-threshold=10
axon.aggregate.messagingEndpoint.snapshot-threshold=10
axon.aggregate.accessPolicy.snapshot-threshold=10
axon.aggregate.apiKey.snapshot-threshold=10
axon.aggregate.deviceCertificate.snapshot-threshold=10
axon.aggregate.provisioningRecord.snapshot-threshold=10
axon.aggregate.digitalTwin.snapshot-threshold=10
axon.aggregate.twinTemplate.snapshot-threshold=10
axon.aggregate.twinChangeEvent.snapshot-threshold=10
axon.aggregate.maintenanceTicket.snapshot-threshold=10
axon.aggregate.dataRetentionPolicy.snapshot-threshold=10
axon.aggregate.softwareUpdateCampaign.snapshot-threshold=10
axon.aggregate.softwareUpdateExecution.snapshot-threshold=10
axon.aggregate.deviceGroup.snapshot-threshold=10
axon.aggregate.usageRecord.snapshot-threshold=10

# =============================================================
# snap shot thresholds are applied per aggregate using the custom defined value
# =============================================================

# =============================================================
# this configuration is recommended by AxonIQ, assign to message
# then general and events will use that value
# =============================================================
#axon.serializer.messages=xstream
#axon.serializer.general=java
axon.serializer.events=jackson
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false



# =============================================================
# For a Distribute AxonIQ
# =============================================================

# ============================================================
# Standard Spring Boot properties to set up persistence
# =============================================================
# The name of this app:
spring.application.name=iotOnAxon
server.port=8080

# =============================================================
# Logging on
# =============================================================
logging.level.com.harbormaster=debug

# =============================================================
# The default profiles are "all of them"
# =============================================================
spring.profiles.active=null

 
# =============================================================
# spring jpa/hibernate params
# =============================================================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.datasource.url=jdbc:mysql://localhost:3306/banking-on-spring-boot
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=com.mysql.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=letmein2
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.id.new_generator_mappings=false

# =============================================================
# enable security support - jwt, form-login, oauth2,  apikey
# =============================================================
hm.security.authentication=

