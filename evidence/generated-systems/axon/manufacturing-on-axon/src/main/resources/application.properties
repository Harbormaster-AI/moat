
spring.liquibase.enabled=false


# =============================================================
# debug level for AxonIQ
logging.level.io.axoniq.demo=debug

# =============================================================
# Management endpoints inclusion
# =============================================================
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=*

# =============================================================
# Axon Server
# =============================================================
axon.axonserver.enabled=false
axon.axonserver.servers=localhost

# =============================================================
# snap shot thresholds are applied per class using the default value
# =============================================================
axon.aggregate.enterprise.snapshot-threshold=10
axon.aggregate.businessUnit.snapshot-threshold=10
axon.aggregate.plant.snapshot-threshold=10
axon.aggregate.productionLine.snapshot-threshold=10
axon.aggregate.workCenter.snapshot-threshold=10
axon.aggregate.item.snapshot-threshold=10
axon.aggregate.bOM.snapshot-threshold=10
axon.aggregate.bOMItem.snapshot-threshold=10
axon.aggregate.routing.snapshot-threshold=10
axon.aggregate.operation.snapshot-threshold=10
axon.aggregate.workOrder.snapshot-threshold=10
axon.aggregate.productionSchedule.snapshot-threshold=10
axon.aggregate.supplier.snapshot-threshold=10
axon.aggregate.purchaseOrder.snapshot-threshold=10
axon.aggregate.purchaseOrderLine.snapshot-threshold=10
axon.aggregate.goodsReceipt.snapshot-threshold=10
axon.aggregate.goodsReceiptLine.snapshot-threshold=10
axon.aggregate.warehouse.snapshot-threshold=10
axon.aggregate.location.snapshot-threshold=10
axon.aggregate.inventoryItem.snapshot-threshold=10
axon.aggregate.inventoryTransaction.snapshot-threshold=10
axon.aggregate.customer.snapshot-threshold=10
axon.aggregate.salesOrder.snapshot-threshold=10
axon.aggregate.salesOrderLine.snapshot-threshold=10
axon.aggregate.qualitySpecification.snapshot-threshold=10
axon.aggregate.inspectionPlan.snapshot-threshold=10
axon.aggregate.inspectionCharacteristic.snapshot-threshold=10
axon.aggregate.inspectionLot.snapshot-threshold=10
axon.aggregate.inspectionResult.snapshot-threshold=10
axon.aggregate.nonconformance.snapshot-threshold=10
axon.aggregate.correctiveAction.snapshot-threshold=10
axon.aggregate.asset.snapshot-threshold=10
axon.aggregate.maintenancePlan.snapshot-threshold=10
axon.aggregate.maintenanceOrder.snapshot-threshold=10
axon.aggregate.employee.snapshot-threshold=10
axon.aggregate.shift.snapshot-threshold=10
axon.aggregate.shiftAssignment.snapshot-threshold=10
axon.aggregate.forecast.snapshot-threshold=10
axon.aggregate.forecastLine.snapshot-threshold=10
axon.aggregate.mRPRun.snapshot-threshold=10
axon.aggregate.plannedOrder.snapshot-threshold=10

# =============================================================
# snap shot thresholds are applied per aggregate using the custom defined value
# =============================================================

# =============================================================
# this configuration is recommended by AxonIQ, assign to message
# then general and events will use that value
# =============================================================
#axon.serializer.messages=xstream
#axon.serializer.general=java
axon.serializer.events=jackson
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false



# =============================================================
# For a Distribute AxonIQ
# =============================================================

# ============================================================
# Standard Spring Boot properties to set up persistence
# =============================================================
# The name of this app:
spring.application.name=manufacturingOnAxon
server.port=8080

# =============================================================
# Logging on
# =============================================================
logging.level.com.harbormaster=debug

# =============================================================
# The default profiles are "all of them"
# =============================================================
spring.profiles.active=null

 
# =============================================================
# spring jpa/hibernate params
# =============================================================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.datasource.url=jdbc:mysql://localhost:3306/banking-on-spring-boot
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=com.mysql.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=letmein2
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.id.new_generator_mappings=false

# =============================================================
# enable security support - jwt, form-login, oauth2,  apikey
# =============================================================
hm.security.authentication=

