#------------------------------------------------------------------------------
# Harbormaster Directives
#------------------------------------------------------------------------------
forceFilesToLowercase=true
exclusions=mappings.properties,options.json,blueprint.json


#------------------------------------------------------------------------------
# root level inclusions
#------------------------------------------------------------------------------
Gemfile=bankingonrails
$appName.gemspec=bankingonrails
Dockerfile=bankingonrails
Rakefile=bankingonrails
config.ru=bankingonrails
.ruby-version=bankingonrails

#------------------------------------------------------------------------------
# config level
#------------------------------------------------------------------------------
application.rb=$appName.config
boot.rb=$appName.config
environment.rb=$appName.config
harbormaster_test.rb=$appName.config
routes.rb=$appName.config
puma.rb=$appName.config
database.yml=$appName.config
storage.yml=$appName.config


#------------------------------------------------------------------------------
# config.environment inclusions
#------------------------------------------------------------------------------
development.rb=$appName.config.environments
test.rb=$appName.config.environments
production.rb=$appName.config.environments

#------------------------------------------------------------------------------
# config.locales inclusions
#------------------------------------------------------------------------------
en.yml=$appName.config.locales

#------------------------------------------------------------------------------
# config.locales inclusions
#------------------------------------------------------------------------------
manifest.js=$appName.app.assets.config
#------------------------------------------------------------------------------
# controller level inclusions
#------------------------------------------------------------------------------
__classes__s_controller.rb=$appName.app.controllers
welcome_controller.rb=$appName.app.controllers
application_controller.rb=$appName.app.controllers

#------------------------------------------------------------------------------
# model level inclusions
#------------------------------------------------------------------------------
__classes__.rb=$appName.app.models
application_record.rb=$appName.app.models

#------------------------------------------------------------------------------
# javascript level inclusions
#------------------------------------------------------------------------------
application.js=$appName.app.javascript

#------------------------------------------------------------------------------
# stylesheet level inclusions
#------------------------------------------------------------------------------
application.css=$appName.assets.stylesheets
__classes__.css=$appName.assets.stylesheets

#------------------------------------------------------------------------------
# helper level inclusions
#------------------------------------------------------------------------------
__classes___helper.rb=$appName.app.helpers
application_helper.rb=$appName.app.helpers

#------------------------------------------------------------------------------
# job level inclusions
#------------------------------------------------------------------------------
application_job.rb=$appName.app.jobs

#------------------------------------------------------------------------------
# view level inclusions
#------------------------------------------------------------------------------
index.html.erb=$appName.app.views.$classNames
_form.html.erb=$appName.app.views.$classNames
new.html.erb=$appName.app.views.$classNames
edit.html.erb=$appName.app.views.$classNames
welcomeIndex.html.erb=$appName.app.views.welcome

#------------------------------------------------------------------------------
# layout level inclusions
#------------------------------------------------------------------------------
application.html.erb=$appName.app.views.layouts
welcome.html.erb=$appName.app.views.layouts

#------------------------------------------------------------------------------
# test level inclusions
#------------------------------------------------------------------------------
test_helper.rb=$appName.test
application_system_test_case.rb=$appName.test
application_test_case.rb=$appName.test
__classes__s.yml=$appName.test.fixtures
__classes___test.rb=$appName.test.models
__classes___controller_test.rb=$appName.test.controllers

#------------------------------------------------------------------------------
# migrate level inclusions
#------------------------------------------------------------------------------
*initial_migration.rb=$appName.db.migrate

#------------------------------------------------------------------------------
# seed level inclusions
#------------------------------------------------------------------------------
seeds.rb=$appName.db

#------------------------------------------------------------------------------
# bin level
#------------------------------------------------------------------------------
rails=$appName.bin
rake=$appName.bin
setup=$appName.bin

#------------------------------------------------------------------------------
# CI/CD Platforms
#------------------------------------------------------------------------------

#------------------------------------------------------------------------------
# terraform plan
#------------------------------------------------------------------------------
#()